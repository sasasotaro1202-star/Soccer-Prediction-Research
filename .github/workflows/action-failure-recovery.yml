name: Action Failure Recovery

on:
  workflow_run:
    workflows:
      - Soccer CI
      - Legacy V9/V12 Bridge Check
      - OpenAI API Check
      - Overnight Integrity
      - PIT Replay Audit
      - Soccer Coverage Fixture PIT Audit
      - Soccer Coverage PIT Audit
      - Soccer Research Cycle
      - Soccer Research Robust
    types: [completed]

permissions:
  actions: write

concurrency:
  group: action-failure-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-failed-jobs-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic one-time recovery for failed workflow: ${RUN_NAME} (${RUN_ID})"
          gh run rerun "${RUN_ID}" --failed --repo "${GITHUB_REPOSITORY}"
          echo "Recovery rerun requested. No quality gate is bypassed; the original workflow remains authoritative."
