name: Action Failure Recovery

on:
  workflow_run:
    workflows:
      - Soccer CI
      - Soccer PIT Replay Audit
      - Soccer Matchday Intelligence Refresh
      - Legacy V9/V12 Bridge Check
      - Overnight Integrity
      - Soccer Ultimate Experiment Matrix
      - Soccer Feature Set Research
      - Autonomous GitHub Controller
      - Soccer Autonomous Orchestrator
      - Soccer Dynamic Simulator Research
      - Soccer Prospective In-Play PIT Capture
      - Soccer Prospective In-Play Maturity
      - Soccer World Model Supervisor
      - Soccer Match State Research
      - Soccer 9H Autonomous Research
      - Soccer Daily Research Forecast
      - Soccer Research Robust
      - Soccer Predictability Research
      - Soccer Historical Learning
      - Soccer Experience Ledger
      - Soccer Adaptive Data Discovery
      - Soccer Scope Frontier Discovery
      - Soccer Coverage PIT Audit
      - Soccer Coverage Fixture PIT Audit
      - Soccer Versioned Result PIT Research
      - Soccer Global Data Lake Research
      - Soccer MOM Research
      - Full Competition Catalog Audit
      - Soccer Opta-like Source Probe
      - Soccer Research Cycle
      - Soccer Control Plane Watchdog
      - Soccer Automation Heartbeat
      - Soccer Opta-like 24H Research Marathon
    types: [completed]

permissions:
  actions: write

concurrency:
  # Isolate recovery by source workflow so a failure in one lane cannot cancel
  # recovery for a different lane. Each workflow_run is still retried only once.
  group: action-failure-recovery-${{ github.event.workflow_run.name }}
  cancel-in-progress: true

jobs:
  retry-failed-jobs-once:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic one-time recovery for failed workflow: ${RUN_NAME} (${RUN_ID})"

          for attempt in 1 2 3; do
            if gh run rerun "${RUN_ID}" --failed --repo "${GITHUB_REPOSITORY}"; then
              echo "Recovery rerun requested on attempt ${attempt}."
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Recovery request failed after 3 attempts; preserving the original failure signal." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "Recovery request failed; retrying in ${sleep_seconds}s..." >&2
            sleep "${sleep_seconds}"
          done

          echo "No quality gate is bypassed; the original workflow remains authoritative."
