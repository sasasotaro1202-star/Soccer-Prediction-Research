name: Action Failure Recovery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - Soccer CI
      - Soccer PIT Replay Audit
      - Soccer Matchday Intelligence Refresh
      - Legacy V9/V12 Bridge Check
      - Overnight Integrity
      - Soccer Ultimate Experiment Matrix
      - Soccer Feature Set Research
      - Autonomous GitHub Controller
      - Soccer Autonomous Orchestrator
      - Soccer Dynamic Simulator Research
      - Soccer Prospective In-Play PIT Capture
      - Soccer Prospective In-Play Maturity
      - Soccer World Model Supervisor
      - Soccer 9H Autonomous Research
      - Soccer Match State Research
      - Soccer Control Plane Watchdog
      - Soccer Automation Heartbeat
      - Soccer 9H Recovery
      - Soccer 9H Queue Watchdog
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  # Workflow-run failures for different lanes must not cancel each other.
  # Scheduled catch-up uses a shared empty suffix and therefore remains serialized.
  group: action-failure-recovery-${{ github.event.workflow_run.name }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}

jobs:
  event-recovery:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed source workflow once
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic one-time recovery for ${RUN_NAME} (${RUN_ID})."
          for attempt in 1 2 3; do
            if gh run rerun "${RUN_ID}" --failed --repo "${GH_REPO}"; then
              echo "Recovery rerun requested on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Recovery request failed after bounded retries." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

  scheduled-catchup:
    if: github.event_name == 'schedule'
    name: Catch missed failure-recovery events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile recent failed current-main workflows
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          now_epoch="$(date +%s)"
          min_age_seconds=300
          max_age_seconds=21600
          rerun_budget=4
          rerun_count=0
          failures=0

          workflows=(
            "Soccer CI"
            "Soccer PIT Replay Audit"
            "Soccer Matchday Intelligence Refresh"
            "Legacy V9/V12 Bridge Check"
            "Overnight Integrity"
            "Soccer Ultimate Experiment Matrix"
            "Soccer Feature Set Research"
            "Autonomous GitHub Controller"
            "Soccer Autonomous Orchestrator"
            "Soccer Dynamic Simulator Research"
            "Soccer Prospective In-Play PIT Capture"
            "Soccer Prospective In-Play Maturity"
            "Soccer World Model Supervisor"
            "Soccer 9H Autonomous Research"
            "Soccer Match State Research"
            "Soccer Control Plane Watchdog"
            "Soccer Automation Heartbeat"
            "Soccer Automation Integrity Audit"
            "Soccer 9H Recovery"
            "Soccer 9H Queue Watchdog"
          )

          for workflow in "${workflows[@]}"; do
            if ! candidates="$(gh run list --repo "${GH_REPO}" --workflow "${workflow}" --limit 100 --json databaseId,createdAt,status,conclusion,headSha --jq '.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out")) | [.databaseId, .createdAt, .headSha] | @tsv')"; then
              echo "Recovery query failed for workflow=${workflow}; preserving failure signal." >&2
              failures=$((failures + 1))
              continue
            fi
            while IFS=$'\t' read -r run_id created_at head_sha; do
              [ -n "${run_id}" ] || continue
              [ "${head_sha}" = "${main_sha}" ] || continue
              created_epoch="$(date -u -d "${created_at}" +%s)"
              age=$((now_epoch - created_epoch))
              if [ "${age}" -lt "${min_age_seconds}" ] || [ "${age}" -gt "${max_age_seconds}" ]; then
                continue
              fi
              attempt="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" --jq '.run_attempt')"
              [ "${attempt}" -eq 1 ] || continue
              if [ "${rerun_count}" -ge "${rerun_budget}" ]; then
                echo "Recovery budget exhausted; leaving remaining failures explicit." >&2
                failures=$((failures + 1))
                break
              fi
              recovered=false
              for request_attempt in 1 2 3; do
                if gh run rerun "${run_id}" --failed --repo "${GH_REPO}"; then
                  echo "Scheduled recovery requested: ${workflow} run=${run_id}"
                  recovered=true
                  rerun_count=$((rerun_count + 1))
                  break
                fi
                if [ "${request_attempt}" -lt 3 ]; then
                  sleep $((request_attempt * 5))
                fi
              done
              if [ "${recovered}" != true ]; then
                echo "Scheduled recovery failed: ${workflow} run=${run_id}" >&2
                failures=$((failures + 1))
              fi
            done <<< "${candidates}"
          done

          if [ "${failures}" -gt 0 ]; then
            echo "Scheduled recovery finished with ${failures} unresolved failure(s)." >&2
            exit 1
          fi
          echo "Scheduled recovery completed with ${rerun_count} rerun request(s)."
