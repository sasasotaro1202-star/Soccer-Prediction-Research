name: Action Failure Recovery

on:
  # Failure detection is schedule-based to avoid creating a run for every normal
  # workflow completion. The scanner reconciles recent current-main failures.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  # One recovery scan runs to completion. A later tick may replace only
  # the pending request; it must never interrupt an active recovery scan.
  group: action-failure-recovery
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  scheduled-catchup:
    if: github.event_name == 'schedule'
    name: Catch missed failure-recovery events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile recent failed current-main workflows
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          now_epoch="$(date +%s)"
          min_age_seconds=300
          max_age_seconds=21600
          rerun_budget=2
          rerun_count=0
          failures=0

          workflows=(
            "Soccer CI"
            "Soccer PIT Replay Audit"
            "Soccer Matchday Intelligence Refresh"
            "Legacy V9/V12 Bridge Check"
            "Overnight Integrity"
            "Soccer Ultimate Experiment Matrix"
            "Soccer Feature Set Research"
            "Soccer Dynamic Simulator Research"
            "Soccer Prospective In-Play PIT Capture"
            "Soccer Prospective In-Play Maturity"
            "Soccer World Model Supervisor"
            "Soccer 9H Autonomous Research"
            "Soccer Match State Research"
            "Soccer Daily Research Forecast"
            "Soccer Live Research Forecast"
          )

          for workflow in "${workflows[@]}"; do
            if ! candidates="$(gh run list --repo "${GH_REPO}" --workflow "${workflow}" --limit 30 --json databaseId,createdAt,status,conclusion,headSha |
              jq -r --arg main_sha "${main_sha}" '
                [.[] |
                  select(.headSha == $main_sha) |
                  select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out"))
                ] |
                sort_by(.createdAt) | reverse | .[0] |
                if . == null then empty else [.databaseId, .createdAt, .headSha] | @tsv end')"; then
              echo "Recovery query failed for workflow=${workflow}; preserving failure signal." >&2
              failures=$((failures + 1))
              continue
            fi
            while IFS=$'\t' read -r run_id created_at head_sha; do
              [ -n "${run_id}" ] || continue
              [ "${head_sha}" = "${main_sha}" ] || continue
              created_epoch="$(date -u -d "${created_at}" +%s)"
              age=$((now_epoch - created_epoch))
              if [ "${age}" -lt "${min_age_seconds}" ] || [ "${age}" -gt "${max_age_seconds}" ]; then
                continue
              fi
              run_payload="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")" || {
                echo "Recovery run metadata query failed for workflow=${workflow} run=${run_id}; preserving failure signal." >&2
                failures=$((failures + 1))
                continue
              }
              attempt="$(jq -r '.run_attempt // 0' <<< "${run_payload}")"
              conclusion="$(jq -r '.conclusion // ""' <<< "${run_payload}")"

              if ! jobs_payload="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100")"; then
                echo "Recovery job-detail query failed for workflow=${workflow} run=${run_id}; preserving failure signal." >&2
                failures=$((failures + 1))
                continue
              fi

              decision="$(printf '%s' "${jobs_payload}" | python3 scripts/action_failure_recovery.py "${conclusion}" "${attempt}")" || {
                echo "Recovery classifier failed for workflow=${workflow} run=${run_id}; preserving failure signal." >&2
                failures=$((failures + 1))
                continue
              }
              retryable="$(jq -r '.retryable' <<< "${decision}")"
              reason="$(jq -r '.reason' <<< "${decision}")"
              echo "Recovery classification: workflow=${workflow} run=${run_id} retryable=${retryable} reason=${reason}"
              if [ "${retryable}" != "true" ]; then
                echo "Automatic rerun withheld; deterministic/unknown failure remains blocking." >&2
                failures=$((failures + 1))
                continue
              fi

              if [ "${rerun_count}" -ge "${rerun_budget}" ]; then
                echo "Recovery budget exhausted; leaving remaining failures explicit." >&2
                failures=$((failures + 1))
                break
              fi
              recovered=false
              for request_attempt in 1 2 3; do
                if gh run rerun "${run_id}" --failed --repo "${GH_REPO}"; then
                  echo "Scheduled recovery requested: ${workflow} run=${run_id}"
                  recovered=true
                  rerun_count=$((rerun_count + 1))
                  break
                fi
                if [ "${request_attempt}" -lt 3 ]; then
                  sleep $((request_attempt * 5))
                fi
              done
              if [ "${recovered}" != true ]; then
                echo "Scheduled recovery failed: ${workflow} run=${run_id}" >&2
                failures=$((failures + 1))
              fi
            done <<< "${candidates}"
          done

          if [ "${failures}" -gt 0 ]; then
            echo "Scheduled recovery finished with ${failures} unresolved failure(s)." >&2
            exit 1
          fi
          echo "Scheduled recovery completed with ${rerun_count} rerun request(s)."
