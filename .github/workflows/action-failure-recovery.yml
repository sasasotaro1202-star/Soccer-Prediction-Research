name: Action Failure Recovery

on:
  workflow_run:
    workflows:
      - Soccer CI
      - Soccer PIT Replay Audit
      - Soccer Matchday Intelligence Refresh
      - Legacy V9/V12 Bridge Check
      - Overnight Integrity
      - Soccer Ultimate Experiment Matrix
      - Soccer Feature Set Research
      - Autonomous GitHub Controller
      - Soccer 9H Autonomous Research
    types: [completed]

permissions:
  actions: write

concurrency:
  # One bounded recovery controller; it never recursively retries an already retried run.
  group: action-failure-recovery-soccer
  cancel-in-progress: true

jobs:
  retry-failed-jobs-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic one-time recovery for failed workflow: ${RUN_NAME} (${RUN_ID})"

          for attempt in 1 2 3; do
            if gh run rerun "${RUN_ID}" --failed --repo "${GITHUB_REPOSITORY}"; then
              echo "Recovery rerun requested on attempt ${attempt}."
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Recovery request failed after 3 attempts; preserving the original failure signal." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "Recovery request failed; retrying in ${sleep_seconds}s..." >&2
            sleep "${sleep_seconds}"
          done

          echo "No quality gate is bypassed; the original workflow remains authoritative."
