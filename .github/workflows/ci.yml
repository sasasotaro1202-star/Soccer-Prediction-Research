name: Soccer CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "requests/**"
      # Research/production workflows persist machine-generated evidence separately.
      # Artifact/data-only pushes do not require a full source/test CI cycle.
      - "artifacts/**"
      - "models/current/**"
      - "data/experience/**"
      - "data/raw/**"
      - ".github/automation/**"
      # High-frequency generated World Model evidence is validated by its own research lanes.
      - "data/research/prospective_inplay/raw/**"
      - "data/research/match_state_snapshots/**"
      - "data/research/match_state_research_status.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main-branch CI is intentionally re-runnable on the exact latest commit for final verification.

concurrency:
  # CI is disposable; keep only the newest verification for each ref to prevent stale queue buildup.
  # Long-running 9H research uses a separate concurrency group and is never cancelled by this policy.
  group: soccer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |f| YAML.parse_file(f); puts "YAML_OK #{f}" }'
      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run deterministic test suite
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 300 \
            python -m pytest -q -vv --durations=20
