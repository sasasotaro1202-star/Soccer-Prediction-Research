name: External OSS Statsmodels Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/external_oss/**"
      - "tests/test_statsmodels_poisson_research.py"
      - "requirements-research.txt"
      - "docs/EXTERNAL_OSS_RESEARCH_EXPERIMENTS_V1.md"
      - ".github/workflows/external-oss-statsmodels-research.yml"
  workflow_dispatch:


concurrency:
  group: external-oss-statsmodels-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  statsmodels-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and research dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements-research.txt

      - name: Run isolated research adapter tests
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q \
            tests/test_statsmodels_poisson_research.py \
            tests/test_statsmodels_score_oos.py \
            tests/test_score_distribution_calibration.py \
            tests/test_statsmodels_research_boundary.py \
            tests/test_statsmodels_robustness.py
