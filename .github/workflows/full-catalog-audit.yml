name: Full Competition Catalog Audit

on:
  push:
    branches: [main]
    paths:
      - "src/data/competition_catalog.py"
      - "src/data/competition_sources.py"
      - "src/data/full_catalog_audit.py"
      - ".github/workflows/full-catalog-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run full catalog audit
        env:
          PYTHONPATH: .
        run: python -m src.data.full_catalog_audit
      - name: Upload audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: full-catalog-audit-${{ github.run_id }}
          path: artifacts/full_catalog_audit*
          if-no-files-found: error
