name: Legacy V9/V12 Bridge Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Bridge verification is disposable; validate only the latest main revision.
  group: soccer-legacy-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Research Engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Checkout legacy soccer repository
        uses: actions/checkout@v6
        with:
          repository: sasasotaro1202-star/soccer
          path: legacy/soccer
          ref: main

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile legacy bridge without executing it
        run: |
          python -m py_compile legacy/soccer/backtest.py
          python -m py_compile legacy/soccer/research_adapter_v9.py

      - name: Install Research Engine dependencies
        run: python -m pip install -r requirements.txt

      - name: Run adapter, PIT, feature replay, and comparison tests
        run: |
          python -m pytest -q \
            tests/test_v9_v12_adapter.py \
            tests/test_pit_source_adapter.py \
            tests/test_pit_feature_replay.py \
            tests/test_baseline_comparison.py
