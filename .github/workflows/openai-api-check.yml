name: OpenAI API Check

on:
  workflow_dispatch:

jobs:
  openai-api-check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check OpenAI API connectivity
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is not configured."
            exit 1
          fi

          http_code=$(curl -sS \
            -o /tmp/openai_response.json \
            -w "%{http_code}" \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-5.6-luna","input":"Reply with exactly: SOCCER_RESEARCH_API_OK"}')

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "OpenAI API connectivity check: OK (HTTP $http_code)"
          else
            echo "OpenAI API connectivity check failed (HTTP $http_code)"
            cat /tmp/openai_response.json
            exit 1
          fi
