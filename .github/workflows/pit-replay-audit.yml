name: Soccer PIT Replay Audit

on:
  workflow_dispatch:
    inputs:
      competition:
        description: "Competition to audit"
        required: true
        default: "EPL"
        type: string
      rows_per_season:
        description: "Deterministic sample rows per season"
        required: true
        default: "1"
        type: string
  push:
    paths:
      - "src/data/pit_source_adapter.py"
      - "src/data/pit_source_adapter_v2.py"
      - "src/data/pit_source_adapter_fast.py"
      - "src/data/pit_archive_fallback.py"
      - "src/data/pit_evidence.py"
      - "src/data/source_registry.py"
      - "src/data/football_data.py"
      - "src/research/pit_replay_audit.py"
      - "tests/test_pit_source_adapter.py"
      - "tests/test_pit_feature_replay.py"
      - "tests/test_pit_evidence.py"
      - "tests/test_source_registry.py"
      - ".github/workflows/pit-replay-audit.yml"

permissions:
  contents: read

concurrency:
  group: soccer-pit-replay-audit-${{ github.ref }}
  # Preserve an in-flight PIT replay; cancellation can discard evidence without
  # producing a deterministic audit result for the requested snapshot.
  cancel-in-progress: false

jobs:
  pit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 120 }}
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('src/data/football_data.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..." >&2
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run tests
        run: python -m pytest -q tests/test_pit_source_adapter.py tests/test_pit_feature_replay.py tests/test_pit_evidence.py tests/test_source_registry.py
      - name: Run small PIT replay audit (BLOCKED is diagnostic; implementation failures are fatal)
        env:
          AUDIT_COMPETITION: ${{ inputs.competition || 'EPL' }}
          AUDIT_ROWS_PER_SEASON: ${{ inputs.rows_per_season || '1' }}
        run: |
          set -euo pipefail
          set +e
          python -m src.research.pit_replay_audit --competition "$AUDIT_COMPETITION" --rows-per-season "$AUDIT_ROWS_PER_SEASON"
          code=$?
          set -e
          # Exit code 2 is the canonical BLOCKED result for insufficient PIT evidence.
          # Preserve real implementation/runtime failures as non-zero so they cannot
          # be mistaken for an expected evidence shortage.
          if [ "$code" -eq 2 ]; then
            echo "PIT replay audit is BLOCKED: archived evidence is insufficient; production/OOS remain gated."
            exit 0
          fi
          exit "$code"

      - name: Upload PIT audit artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-pit-audit-${{ github.run_id }}
          path: artifacts/pit-audit/
          retention-days: 3

# PIT remains a hard production gate: a BLOCKED audit never authorizes OOS/model adoption.
# This workflow is diagnostic, so insufficient archived evidence is recorded in artifacts
# instead of being misclassified as an Actions infrastructure failure.
# Multi-source registry is metadata only; actual row/field coverage remains evidence-driven.
# Provider-neutral evidence validation is intentionally separate from archive acquisition.
