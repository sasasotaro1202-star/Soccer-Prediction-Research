name: Soccer PIT Replay Audit

on:
  workflow_dispatch:
    inputs:
      competition:
        description: "Competition to audit"
        required: true
        default: "EPL"
        type: string
      rows_per_season:
        description: "Deterministic sample rows per season"
        required: true
        default: "1"
        type: string
  push:
    paths:
      - "src/data/pit_source_adapter.py"
      - "src/data/pit_source_adapter_v2.py"
      - "src/data/pit_source_adapter_fast.py"
      - "src/data/football_data.py"
      - "src/research/pit_replay_audit.py"
      - "tests/test_pit_source_adapter.py"
      - ".github/workflows/pit-replay-audit.yml"

permissions:
  contents: read

jobs:
  pit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('src/data/football_data.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q tests/test_pit_source_adapter.py tests/test_pit_feature_replay.py
      - name: Run small PIT replay audit
        env:
          AUDIT_COMPETITION: ${{ inputs.competition || 'EPL' }}
          AUDIT_ROWS_PER_SEASON: ${{ inputs.rows_per_season || '1' }}
        run: python -m src.research.pit_replay_audit --competition "$AUDIT_COMPETITION" --rows-per-season "$AUDIT_ROWS_PER_SEASON"
      - name: Upload PIT audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-pit-audit-${{ github.run_id }}
          path: artifacts/pit-audit/
          retention-days: 30
