name: Soccer 9H Autonomous Research

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0,8,16 * * *"

permissions:
  contents: write

concurrency:
  # Keep exactly one 9H research cycle active at a time. A main update queues the newest SHA
  # instead of cancelling the running immutable snapshot; the newest queued run becomes the handoff.
  group: soccer-9h-autonomous-main
  cancel-in-progress: false

# Three sequential phases provide up to 12 hours of repository-side work (180 + 360 + 180 minutes).
# The historical workflow name remains 9H for compatibility; the research phase uses the full
# GitHub-hosted runner limit so long OOS runs are not cut off at the previous 180-minute boundary.
# Scheduled starts provide a baseline; the recovery controller chains successful/completed cycles
# through workflow_run and also provides a 15-minute watchdog for missed/stale/cancelled runs.
# Source-code pushes do not restart/cancel a long research cycle; the recovery controller observes main
# and dispatches the newest main SHA only when no current-main cycle is active.
# No production/PIT gate is weakened to keep the workflow green.
jobs:
  phase1_gate:
    name: Phase 1 - strict data/PIT gate
    env:
      GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact workflow-trigger commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Run deterministic tests
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m pytest -q
      - name: Verify 9H continuity contract
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m pytest -q tests/test_9h_continuity_contract.py
      - name: Run structural audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.fixture_field_audit
      - name: Run strict completion gate
        id: completion
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
        run: python -m src.data.completion_gate
      - name: Preserve gate result
        if: always()
        run: |
          mkdir -p artifacts/9h/phase1
          if [ -f artifacts/completion_gate.json ]; then cp artifacts/completion_gate.json artifacts/9h/phase1/completion_gate.json; fi
          if [ -f artifacts/audit_summary.json ]; then cp artifacts/audit_summary.json artifacts/9h/phase1/audit_summary.json; fi
          if [ -f artifacts/pit_competition_breakdown.json ]; then cp artifacts/pit_competition_breakdown.json artifacts/9h/phase1/pit_competition_breakdown.json; fi
          if [ -f artifacts/pit_preflight_manifest.json ]; then cp artifacts/pit_preflight_manifest.json artifacts/9h/phase1/pit_preflight_manifest.json; fi
          if [ -f artifacts/pit_replay_features.csv ]; then cp artifacts/pit_replay_features.csv artifacts/9h/phase1/pit_replay_features.csv; fi
          TARGET_SHA="$(git rev-parse HEAD)"
          printf '{"phase":"phase1_gate","head_sha":"%s","workflow_sha":"%s","completion_step":"${{ steps.completion.outcome }}"}\n' "$TARGET_SHA" "$GITHUB_SHA" > artifacts/9h/phase1/phase_status.json
      - name: Enforce strict completion gate before expensive research
        if: steps.completion.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/completion_gate.json")
          payload = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          if payload.get("full_gate_passed") is not True:
              print("STRICT PIT/completion gate blocked Phase 2/3; preserving evidence only.")
              raise SystemExit(1)
          PY
      - name: Upload phase 1 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-9h-phase1-${{ github.run_id }}
          path: artifacts/9h/phase1
          retention-days: 3
          if-no-files-found: error

  phase2_research:
    if: needs.phase1_gate.result == 'success'
    name: Phase 2 - PIT-safe OOS research
    env:
      GITHUB_TOKEN: ${{ github.token }}
    needs: phase1_gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact workflow-trigger commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw and PIT evidence
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            data/raw
            data/raw/pit_evidence
          key: soccer-9h-data-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/data/**/*.py', 'src/data/*.py') }}
          restore-keys: soccer-9h-data-${{ runner.os }}-
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Download Phase 1 PIT handoff
        uses: actions/download-artifact@v6
        with:
          name: soccer-9h-phase1-${{ github.run_id }}
          path: artifacts/9h/phase1
      - name: Validate Phase 1 PIT handoff
        id: pit_handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/9h/phase1")
          status = json.loads((root / "phase_status.json").read_text(encoding="utf-8")) if (root / "phase_status.json").exists() else {}
          gate = json.loads((root / "completion_gate.json").read_text(encoding="utf-8")) if (root / "completion_gate.json").exists() else {}
          features = root / "pit_replay_features.csv"
          valid = (
              status.get("workflow_sha") == os.environ.get("GITHUB_SHA")
              and status.get("head_sha") == os.environ.get("GITHUB_SHA")
              and status.get("completion_step") == "success"
              and gate.get("full_gate_passed") is True
              and gate.get("pit_publication_time_gate") is True
              and features.is_file()
              and features.stat().st_size > 0
          )
          print(f"PIT_PHASE1_HANDOFF={'true' if valid else 'false'}")
          PY
      - name: Run full tests again on exact commit
        id: research_tests
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m pytest -q
      - name: Persist preflight status artifacts
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.research_tests.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("artifacts").mkdir(parents=True, exist_ok=True)
          passed = os.environ.get("TEST_OUTCOME") == "success"
          Path("artifacts/test_status.json").write_text(json.dumps({"exit_code": 0 if passed else 1, "passed": passed}), encoding="utf-8")
          PY
      - name: Reuse validated Phase 1 PIT artifacts
        if: env.PIT_PHASE1_HANDOFF == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp artifacts/9h/phase1/completion_gate.json artifacts/completion_gate.json
          cp artifacts/9h/phase1/audit_summary.json artifacts/audit_summary.json
          cp artifacts/9h/phase1/pit_competition_breakdown.json artifacts/pit_competition_breakdown.json
          cp artifacts/9h/phase1/pit_preflight_manifest.json artifacts/pit_preflight_manifest.json
          cp artifacts/9h/phase1/pit_replay_features.csv artifacts/pit_replay_features.csv
          printf '%s\n' '{"exit_code":0,"passed":true,"source":"phase1_pit_handoff"}' > artifacts/audit_status.json
      - name: Rebuild audit artifacts before research when handoff unavailable
        if: env.PIT_PHASE1_HANDOFF != 'true'
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          python -m src.data.fixture_field_audit
          PIT_ENABLE_ARCHIVE_AUDIT=1 python -m src.data.completion_gate
      - name: Persist audit execution status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/audit_summary.json")
          payload=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          passed=bool(payload.get("audit_execution_ok", False))
          Path("artifacts/audit_status.json").write_text(json.dumps({"exit_code": 0 if passed else 1, "passed": passed}), encoding="utf-8")
          PY
      - name: Export actual preflight state for research
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          test_payload = json.loads(Path("artifacts/test_status.json").read_text()) if Path("artifacts/test_status.json").exists() else {}
          audit_payload = json.loads(Path("artifacts/audit_status.json").read_text()) if Path("artifacts/audit_status.json").exists() else {}
          print(f"TESTS_PASSED={'true' if test_payload.get('passed') is True else 'false'}")
          print(f"AUDIT_PASSED={'true' if audit_payload.get('passed') is True else 'false'}")
          PY
      - name: Run bounded research engine
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          RESEARCH_ATTEMPTS: "2"
          RESEARCH_RETRY_BACKOFF: "10"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
          PIT_ENABLE_SECONDARY_ARCHIVE: "1"
          PIT_OPENFOOTBALL_COUNTRY_MAX_COMMIT_PAGES: "12"
          PIT_REPLAY_ROWS_PER_GROUP: "1"
        run: python -m src.research.safe_runner
      - name: Record production contract outcome
        id: production_contract
        if: always()
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          set -uo pipefail
          set +e
          python -m src.research.production_contract
          contract_rc=$?
          set -e
          export CONTRACT_RC="${contract_rc}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("artifacts/production_contract.json")
          if not path.exists():
              raise SystemExit("production_contract.json missing after contract evaluation")
          payload = json.loads(path.read_text(encoding="utf-8"))
          passed = payload.get("production_contract_passed")
          if not isinstance(passed, bool):
              raise SystemExit("production_contract.json has no boolean production_contract_passed")
          Path("artifacts/9h").mkdir(parents=True, exist_ok=True)
          Path("artifacts/9h/production_gate_outcome.json").write_text(
              json.dumps({
                  "production_contract_passed": passed,
                  "contract_process_exit_code": int(os.environ["CONTRACT_RC"]),
                  "workflow_treats_as_operational_success": True,
                  "fail_closed_for_persistence": True
              }, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print(json.dumps(payload, ensure_ascii=False))
          PY
      - name: Upload phase 2 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-9h-phase2-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: error

  phase3_verification:
    # Phase 3 is the independent recovery/verification lane. It runs after any non-skipped Phase 2 result,
    # including a timeout/failure, so a transient engine failure cannot consume the entire cycle without
    # an independent retry. Strict production gates remain authoritative.
    if: always() && needs.phase1_gate.result == 'success' && needs.phase2_research.result != 'skipped'
    name: Phase 3 - independent verification and robustness
    env:
      GITHUB_TOKEN: ${{ github.token }}
    needs: [phase1_gate, phase2_research]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact workflow-trigger commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw and PIT evidence
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            data/raw
            data/raw/pit_evidence
          key: soccer-9h-data-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/data/**/*.py', 'src/data/*.py') }}
          restore-keys: soccer-9h-data-${{ runner.os }}-
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Compile and run tests
        id: phase3_tests
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests
          python -m pytest -q
      - name: Rebuild audit artifacts before PIT/completion diagnostics
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.fixture_field_audit
      - name: Re-run PIT/completion diagnostics
        id: phase3_audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
          PIT_ENABLE_SECONDARY_ARCHIVE: "1"
          PIT_OPENFOOTBALL_COUNTRY_MAX_COMMIT_PAGES: "12"
        run: python -m src.data.completion_gate
      - name: Re-run research engine for reproducibility
        env:
          TESTS_PASSED: ${{ steps.phase3_tests.outcome == 'success' }}
          AUDIT_PASSED: ${{ steps.phase3_audit.outcome == 'success' }}
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          RESEARCH_ATTEMPTS: "2"
          RESEARCH_RETRY_BACKOFF: "10"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
          PIT_ENABLE_SECONDARY_ARCHIVE: "1"
          PIT_OPENFOOTBALL_COUNTRY_MAX_COMMIT_PAGES: "12"
          PIT_REPLAY_ROWS_PER_GROUP: "1"
        run: python -m src.research.safe_runner
      - name: Record production contract outcome
        id: production_contract
        if: always()
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          set -uo pipefail
          set +e
          python -m src.research.production_contract
          contract_rc=$?
          set -e
          export CONTRACT_RC="${contract_rc}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("artifacts/production_contract.json")
          if not path.exists():
              raise SystemExit("production_contract.json missing after contract evaluation")
          payload = json.loads(path.read_text(encoding="utf-8"))
          passed = payload.get("production_contract_passed")
          if not isinstance(passed, bool):
              raise SystemExit("production_contract.json has no boolean production_contract_passed")
          Path("artifacts/9h").mkdir(parents=True, exist_ok=True)
          Path("artifacts/9h/production_gate_outcome.json").write_text(
              json.dumps({
                  "production_contract_passed": passed,
                  "contract_process_exit_code": int(os.environ["CONTRACT_RC"]),
                  "workflow_treats_as_operational_success": True,
                  "fail_closed_for_persistence": True,
                  "note": "False production contract remains a recorded research gate; it never authorizes persistence."
              }, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )
          print(json.dumps(payload, ensure_ascii=False))
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as fh:
                  fh.write(f"production_contract_passed={str(passed).lower()}\n")
          PY
          exit "${contract_rc}"
      - name: Verify latest-main handoff before persistence
        id: latest_main_handoff
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/9h
          TRIGGER_SHA="${GITHUB_SHA}"
          if git fetch origin main >/tmp/latest-main-fetch.log 2>&1; then
            MAIN_SHA="$(git rev-parse origin/main)"
            if [ "${MAIN_SHA}" = "${TRIGGER_SHA}" ]; then
              CURRENT_MAIN_MATCHES="true"
              echo "LATEST_MAIN_HANDOFF: exact workflow SHA is still main."
            else
              CURRENT_MAIN_MATCHES="false"
              echo "LATEST_MAIN_HANDOFF: stale immutable research snapshot; trigger=${TRIGGER_SHA} main=${MAIN_SHA}. Persistence will be skipped."
            fi
          else
            MAIN_SHA=""
            CURRENT_MAIN_MATCHES="false"
            echo "LATEST_MAIN_HANDOFF: unable to verify latest main; persistence will be skipped." >&2
            cat /tmp/latest-main-fetch.log >&2 || true
          fi
          echo "current_main_matches=${CURRENT_MAIN_MATCHES}" >> "$GITHUB_OUTPUT"
          export MAIN_SHA CURRENT_MAIN_MATCHES
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "main_sha": os.environ.get("MAIN_SHA", ""),
              "current_main_matches": os.environ.get("CURRENT_MAIN_MATCHES", "false") == "true",
          }
          Path("artifacts/9h/latest_main_handoff.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY
      - name: Export adopted production bundle
        if: >-
          success() &&
          steps.production_contract.outputs.production_contract_passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/production_model.pkl
          test -s artifacts/production_model.json
          test -s artifacts/model_registry.json
          test -s artifacts/production_provenance.json
          test -s artifacts/calibration_gate.json
          mkdir -p artifacts/production_release
          cp artifacts/production_model.pkl artifacts/production_release/
          cp artifacts/production_model.json artifacts/production_release/
          cp artifacts/model_registry.json artifacts/production_release/
          cp artifacts/production_provenance.json artifacts/production_release/
          cp artifacts/calibration_gate.json artifacts/production_release/
          cp artifacts/oos_metrics.csv artifacts/production_release/
          cp artifacts/development_oos_metrics.csv artifacts/production_release/
          cp artifacts/locked_oos_metrics.csv artifacts/production_release/
          cp artifacts/model_selection.csv artifacts/production_release/
          cp artifacts/adoption_decision.json artifacts/production_release/
      - name: Persist validated current production model
        if: >-
          success() &&
          steps.production_contract.outputs.production_contract_passed == 'true' &&
          steps.latest_main_handoff.outputs.current_main_matches == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s artifacts/production_model.pkl
          test -s artifacts/production_model.json
          test -s artifacts/model_registry.json
          test -s artifacts/production_provenance.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B persist-current-production origin/main
            mkdir -p models/current
            cp artifacts/production_model.pkl models/current/production_model.pkl
            cp artifacts/production_model.json models/current/production_model.json
            cp artifacts/model_registry.json models/current/model_registry.json
            cp artifacts/production_provenance.json models/current/production_provenance.json
            python - <<'PY'
            import hashlib, json
            from pathlib import Path
            root=Path('models/current')
            bundle=root/'production_model.pkl'
            meta=json.loads((root/'production_model.json').read_text(encoding='utf-8'))
            registry=json.loads((root/'model_registry.json').read_text(encoding='utf-8'))
            manifest={
                'status':'ACTIVE_ADOPTED',
                'model_version':registry.get('model_version') or meta.get('model_version'),
                'bundle_sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),
                'research_git_sha':registry.get('git_commit_sha'),
                'updated_from_validated_cycle':True,
            }
            (root/'ACTIVE_MODEL.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding='utf-8')
            PY
            git add models/current
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: persist validated current production model"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Production persistence push attempt ${attempt} failed; retrying against latest main."
          done
          exit 1
      - name: Persist validated research candidate
        if: >-
          always() &&
          steps.latest_main_handoff.outputs.current_main_matches == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s artifacts/validated_candidate_model.pkl ] || [ ! -s artifacts/validated_candidate_model.json ] || [ ! -s artifacts/validated_candidate_registry.json ] || [ ! -s artifacts/validated_candidate_provenance.json ]; then
            echo "No validated candidate was produced in this cycle."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/validated_candidate_registry.json').read_text(encoding='utf-8'))
          p=json.loads(Path('artifacts/validated_candidate_provenance.json').read_text(encoding='utf-8'))
          if r.get('adoption_status') != 'VALIDATED_CANDIDATE': raise SystemExit('candidate registry status is not VALIDATED_CANDIDATE')
          if p.get('status') != 'VALIDATED_CANDIDATE': raise SystemExit('candidate provenance status is invalid')
          if p.get('locked_oos_used_for_training') is not False: raise SystemExit('candidate is not locked-OOS clean')
          if (p.get('calibration_gate') or {}).get('status') != 'PASS': raise SystemExit('candidate calibration gate is not PASS')
          if str(r.get('model_version')) != str(p.get('model_version')): raise SystemExit('candidate model version mismatch')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B persist-validated-candidate origin/main
            mkdir -p models/current
            cp artifacts/validated_candidate_model.pkl models/current/validated_candidate_model.pkl
            cp artifacts/validated_candidate_model.json models/current/validated_candidate_model.json
            cp artifacts/validated_candidate_registry.json models/current/validated_candidate_registry.json
            cp artifacts/validated_candidate_provenance.json models/current/validated_candidate_provenance.json
            git add models/current/validated_candidate_model.pkl models/current/validated_candidate_model.json models/current/validated_candidate_registry.json models/current/validated_candidate_provenance.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: persist validated research candidate"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Validated candidate persistence push attempt ${attempt} failed; retrying against latest main."
          done
          exit 1
      - name: Write 9-hour health record
        if: always()
        run: |
          mkdir -p artifacts/9h
          python - <<'PY'
          import json, os
          from pathlib import Path
          gate = Path("artifacts/completion_gate.json")
          status = Path("artifacts/run_status.json")
          handoff = Path("artifacts/9h/latest_main_handoff.json")
          payload = {
              "workflow": "soccer-9h-autonomous",
              "head_sha": os.popen("git rev-parse HEAD").read().strip(),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "gate_present": gate.exists(),
              "run_status_present": status.exists(),
              "production_gate_remains_strict": True,
              "latest_main_handoff": json.loads(handoff.read_text(encoding="utf-8")) if handoff.exists() else {"current_main_matches": False},
              "max_planned_runtime_minutes": 720,
              "note": "No gate is relaxed for the purpose of producing a green workflow."
          }
          if Path("artifacts/production_provenance.json").exists():
              Path("artifacts/9h/production_provenance.json").write_bytes(Path("artifacts/production_provenance.json").read_bytes())
          Path("artifacts/9h/health.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY
      - name: Upload phase 3 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-9h-phase3-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
          if-no-files-found: error

# This workflow intentionally lives on main so the schedule is active.
# Operational note: a workflow-file commit intentionally starts a fresh 9H cycle on the latest main SHA.
# Keep the long research cycle pinned to the newest main commit and strict gates.
# The recovery controller prefers runs whose head_sha matches current main.
# Fresh-cycle marker kept intentionally lightweight so code changes and provenance gates are verified on the current main SHA.
# Latest-main handoff remains non-cancelling so an older research cycle can finish safely.
# Phase 2 is allowed up to the GitHub-hosted 6-hour job limit; recovery age checks include margin for
# the full 12-hour three-phase cycle.
