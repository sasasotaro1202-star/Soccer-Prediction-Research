name: Soccer 9H Recovery Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: soccer-9h-recovery
  cancel-in-progress: true

jobs:
  watchdog:
    name: Monitor and recover 9H research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and recover 9H workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/runs?per_page=10"
          MAIN_SHA="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}")"

          DECISION="$(python - "${JSON}" "${MAIN_SHA}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          payload = json.loads(sys.argv[1])
          main_sha = sys.argv[2]
          runs = payload.get("workflow_runs", [])

          now = datetime.now(timezone.utc)
          active = []
          for r in runs:
              if r.get("head_branch") != "main":
                  continue
              status = r.get("status")
              if status not in {"pending", "queued", "waiting", "in_progress"}:
                  continue
              started = r.get("run_started_at") or r.get("created_at")
              if started:
                  try:
                      age_hours = (now - datetime.fromisoformat(started.replace("Z", "+00:00"))).total_seconds() / 3600.0
                  except ValueError:
                      age_hours = 0.0
                  if age_hours <= 10.0:
                      active.append(r)
              else:
                  active.append(r)
          if active:
              print("ACTIVE")
              raise SystemExit(0)

          def when(r):
              raw = r.get("updated_at") or r.get("created_at")
              if not raw:
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(raw.replace("Z", "+00:00"))

          completed = [r for r in runs if r.get("status") == "completed"]
          completed.sort(key=when, reverse=True)

          if not completed:
              print("DISPATCH")
              raise SystemExit(0)

          latest = completed[0]
          conclusion = latest.get("conclusion")
          age_hours = (datetime.now(timezone.utc) - when(latest)).total_seconds() / 3600.0
          latest_sha = latest.get("head_sha")
          print(
              f"STATE conclusion={conclusion} run_id={latest.get('id')} age_hours={age_hours:.2f} latest_sha={latest_sha} main_sha={main_sha}",
              file=sys.stderr,
          )

          # Never retry an obsolete commit when main has advanced. Dispatch the current main.
          if latest_sha and main_sha and latest_sha != main_sha:
              print("DISPATCH")
          elif conclusion in {"failure", "timed_out"}:
              print(f"RERUN {latest.get('id')}")
          elif conclusion != "success" or age_hours >= 8.0:
              print("DISPATCH")
          else:
              print("ACTIVE")
          PY
          )"

          ACTION="${DECISION%% *}"
          RUN_ID="${DECISION#* }"

          case "${ACTION}" in
            ACTIVE)
              echo "RECOVERY: active run exists or recent success; no action."
              ;;
            RERUN)
              CODE="$(curl -sS -o /tmp/rerun.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs")"
              case "${CODE}" in
                201|202)
                  echo "RECOVERY: rerun-failed-jobs accepted for run ${RUN_ID}."
                  ;;
                *)
                  echo "RECOVERY: rerun failed with HTTP ${CODE}; falling back to fresh dispatch."
                  if [ -f /tmp/rerun.json ]; then cat /tmp/rerun.json; fi
                  DISPATCH_CODE="$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -d '{"ref":"main"}' \
                    "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/dispatches")"
                  if [ "${DISPATCH_CODE}" != "204" ]; then
                    echo "RECOVERY: fresh dispatch failed with HTTP ${DISPATCH_CODE}."
                    if [ -f /tmp/dispatch.json ]; then cat /tmp/dispatch.json; fi
                    exit 1
                  fi
                  echo "RECOVERY: fresh 9H workflow dispatch accepted."
                  ;;
              esac
              ;;
            DISPATCH)
              CODE="$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d '{"ref":"main"}' \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/dispatches")"
              case "${CODE}" in
                204)
                  echo "RECOVERY: fresh 9H workflow dispatch accepted."
                  ;;
                409)
                  echo "RECOVERY: dispatch conflict; another controller/run likely won the race."
                  ;;
                *)
                  echo "RECOVERY: dispatch failed with HTTP ${CODE}."
                  cat /tmp/dispatch.json || true
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "RECOVERY: unknown controller state: ${DECISION}"
              exit 1
              ;;
          esac
