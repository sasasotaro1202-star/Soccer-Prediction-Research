name: Soccer 9H Recovery Controller

# The controller is intentionally re-run on repository updates so stale 9H runs are moved to current main.
# Latest-main re-evaluation is intentionally explicit for operational recovery.
# Heartbeat: push-triggered recovery also reconciles any pending run whose SHA is behind main.
# Conservative immutable PIT snapshots are reconciled on this cycle.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soccer-9h-recovery.yml"
      - ".github/workflows/soccer-9h-autonomous.yml"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:
  workflow_run:
    workflows: ["Soccer 9H Autonomous Research"]
    types: [completed]
  schedule:
    # 15-minute watchdog: workflow_run completion chaining is the primary continuity path; this schedule is a secondary safety net with lower scheduler load.
    - cron: "13,28,43,58 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  # Serialize controller invocations without cancelling an active recovery pass.
  # New events wait for the current controller; the controller itself is bounded to 10 minutes.
  group: soccer-9h-recovery-main
  cancel-in-progress: false

jobs:
  watchdog:
    name: Monitor and recover 9H research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and recover 9H workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/runs?per_page=100"
          MAIN_SHA="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}")"

          printf '%s' "${JSON}" > /tmp/9h-runs.json
          DECISION="$(python - "/tmp/9h-runs.json" "${MAIN_SHA}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          main_sha = sys.argv[2]
          runs = payload.get("workflow_runs", [])

          now = datetime.now(timezone.utc)
          max_active_age_hours = 10.5
          active = []
          for r in runs:
              if r.get("head_branch") != "main":
                  continue
              status = r.get("status")
              if status not in {"pending", "queued", "waiting", "requested", "in_progress"}:
                  continue
              active.append(r)

          def age_hours(run):
              started = run.get("run_started_at") or run.get("created_at")
              if not started:
                  return None
              try:
                  return (now - datetime.fromisoformat(started.replace("Z", "+00:00"))).total_seconds() / 3600.0
              except ValueError:
                  return None

          current_active = [r for r in active if r.get("head_sha") == main_sha]
          fresh_current_active = []
          for r in current_active:
              age = age_hours(r)
              if age is None or age <= max_active_age_hours:
                  fresh_current_active.append(r)

          if fresh_current_active:
              print("ACTIVE")
              raise SystemExit(0)

          if active:
              # Only stale/obsolete runs remain; reconcile them before a fresh dispatch.
              print("DISPATCH")
              raise SystemExit(0)

          def when(r):
              raw = r.get("updated_at") or r.get("created_at")
              if not raw:
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(raw.replace("Z", "+00:00"))

          completed = [r for r in runs if r.get("status") == "completed"]
          completed.sort(key=when, reverse=True)

          if not completed:
              print("DISPATCH")
              raise SystemExit(0)

          current_completed = [r for r in completed if r.get("head_sha") == main_sha]
          latest = current_completed[0] if current_completed else completed[0]
          conclusion = latest.get("conclusion")
          age_hours = (datetime.now(timezone.utc) - when(latest)).total_seconds() / 3600.0
          latest_sha = latest.get("head_sha")
          run_attempt = int(latest.get("run_attempt") or 1)

          failure_streak = 0
          for r in current_completed:
              if r.get("conclusion") in {"failure", "timed_out", "cancelled"}:
                  failure_streak += 1
              else:
                  break

          print(
              f"STATE conclusion={conclusion} run_id={latest.get('id')} attempt={run_attempt} "
              f"age_hours={age_hours:.2f} latest_sha={latest_sha} main_sha={main_sha} "
              f"failure_streak={failure_streak}",
              file=sys.stderr,
          )

          # Never retry an obsolete commit when main has advanced. A successful
          # current-main cycle immediately chains the next cycle.
          if latest_sha and main_sha and latest_sha != main_sha:
              print("DISPATCH")
          elif conclusion == "success":
              print("DISPATCH")
          elif conclusion in {"failure", "timed_out", "cancelled"}:
              # Retry a failed attempt once. Repeated same-SHA failures are
              # deliberately cooled down to avoid a wasteful dispatch storm.
              if run_attempt < 2:
                  print(f"RERUN {latest.get('id')}")
              elif failure_streak <= 2 or age_hours >= 1.0:
                  print("DISPATCH")
              else:
                  print("DEFER")
          else:
              print("DISPATCH")
          PY
          )"

          ACTION="${DECISION%% *}"
          RUN_ID="${DECISION#* }"

          verify_current_main_active() {
            for ATTEMPT in 1 2 3 4 5; do
              sleep 3
              VERIFY_JSON="$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/runs?per_page=20")"
              printf '%s' "${VERIFY_JSON}" > /tmp/verify-9h-runs.json
              if VERIFY_MAIN_SHA="${MAIN_SHA}" python - /tmp/verify-9h-runs.json <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          main_sha = os.environ["VERIFY_MAIN_SHA"]
          active = {
              "pending", "queued", "waiting", "requested", "in_progress"
          }
          found = any(
              run.get("head_branch") == "main"
              and run.get("head_sha") == main_sha
              and run.get("status") in active
              for run in payload.get("workflow_runs", [])
          )
          raise SystemExit(0 if found else 1)
          PY
              then
                echo "RECOVERY: verified an active current-main 9H run after control action (attempt ${ATTEMPT}/5)."
                return 0
              fi
              echo "RECOVERY: active current-main run not yet visible after control action (attempt ${ATTEMPT}/5)."
            done
            echo "RECOVERY: control action returned success but no active current-main run was observed." >&2
            return 1
          }

          cancel_obsolete_runs() {
            python - "/tmp/9h-runs.json" "${MAIN_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          main_sha = sys.argv[2]
          for run in payload.get("workflow_runs", []):
              if run.get("head_branch") != "main":
                  continue
              if run.get("head_sha") == main_sha:
                  continue
              # Never interrupt an actively executing immutable research snapshot merely
              # because main advanced. It may finish its bounded 9H cycle safely. Only
              # obsolete queued/requested work may be discarded before a fresh dispatch.
              if run.get("status") not in {"pending", "queued", "waiting", "requested"}:
                  continue
              print(run.get("id"))
          PY
          }

          cancel_stale_current_main_runs() {
            python - "/tmp/9h-runs.json" "${MAIN_SHA}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          main_sha = sys.argv[2]
          now = datetime.now(timezone.utc)
          max_active_age_hours = 10.5

          for run in payload.get("workflow_runs", []):
              if run.get("head_branch") != "main":
                  continue
              if run.get("head_sha") != main_sha:
                  continue
              if run.get("status") not in {"pending", "queued", "waiting", "requested", "in_progress"}:
                  continue
              started = run.get("run_started_at") or run.get("created_at")
              if not started:
                  continue
              try:
                  age = (now - datetime.fromisoformat(started.replace("Z", "+00:00"))).total_seconds() / 3600.0
              except ValueError:
                  continue
              if age > max_active_age_hours:
                  print(run.get("id"))
          PY
          }

          cancel_duplicate_current_main_runs() {
            python - "/tmp/9h-runs.json" "${MAIN_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          main_sha = sys.argv[2]
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_branch") == "main"
              and run.get("head_sha") == main_sha
              and run.get("status") in {"pending", "queued", "waiting", "requested", "in_progress"}
          ]
          if len(active) <= 1:
              raise SystemExit(0)

          def sort_key(run):
              status_rank = 0 if run.get("status") == "in_progress" else 1
              created = str(run.get("created_at") or "")
              return (status_rank, created, int(run.get("id") or 0))

          active.sort(key=sort_key)
          for run in active[1:]:
              print(run.get("id"))
          PY
          }

          case "${ACTION}" in
            ACTIVE)
              # A current-main run may already be queued while an older immutable run
              # is still in progress. Preserve the active run; only obsolete queued work
              # is cancelled so the newest main snapshot remains the eventual handoff.
              while IFS= read -r STALE_RUN_ID; do
                [ -z "${STALE_RUN_ID}" ] && continue
                CANCEL_CODE="$(curl -sS -o /tmp/cancel-active.json -w "%{http_code}" -X POST                   -H "Authorization: Bearer ${GH_TOKEN}"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/cancel")"
                case "${CANCEL_CODE}" in
                  202|409)
                    echo "RECOVERY: cancelled/conflicted obsolete run ${STALE_RUN_ID} while current-main run is active."
                    ;;
                  *)
                    echo "RECOVERY: failed to cancel obsolete run ${STALE_RUN_ID} while current-main run is active (HTTP ${CANCEL_CODE})."
                    if [ -f /tmp/cancel-active.json ]; then cat /tmp/cancel-active.json; fi
                    exit 1
                    ;;
                esac
              done < <(cancel_obsolete_runs)
              while IFS= read -r DUPLICATE_RUN_ID; do
                [ -z "${DUPLICATE_RUN_ID}" ] && continue
                CANCEL_CODE="$(curl -sS -o /tmp/cancel-duplicate.json -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${DUPLICATE_RUN_ID}/cancel")"
                case "${CANCEL_CODE}" in
                  202|409)
                    echo "RECOVERY: cancelled/conflicted duplicate current-main run ${DUPLICATE_RUN_ID}; one canonical run retained."
                    ;;
                  *)
                    echo "RECOVERY: failed to cancel duplicate current-main run ${DUPLICATE_RUN_ID} (HTTP ${CANCEL_CODE})."
                    if [ -f /tmp/cancel-duplicate.json ]; then cat /tmp/cancel-duplicate.json; fi
                    exit 1
                    ;;
                esac
              done < <(cancel_duplicate_current_main_runs)
              while IFS= read -r STALE_CURRENT_RUN_ID; do
                [ -z "${STALE_CURRENT_RUN_ID}" ] && continue
                CANCEL_CODE="$(curl -sS -o /tmp/cancel-stale-current.json -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_CURRENT_RUN_ID}/cancel")"
                case "${CANCEL_CODE}" in
                  202|409)
                    echo "RECOVERY: cancelled/conflicted over-age current-main run ${STALE_CURRENT_RUN_ID}."
                    ;;
                  *)
                    echo "RECOVERY: failed to cancel over-age current-main run ${STALE_CURRENT_RUN_ID} (HTTP ${CANCEL_CODE})."
                    if [ -f /tmp/cancel-stale-current.json ]; then cat /tmp/cancel-stale-current.json; fi
                    exit 1
                    ;;
                esac
              done < <(cancel_stale_current_main_runs)
              echo "RECOVERY: current-main research run is active; obsolete and duplicate runs reconciled."
              ;;
            DEFER)
              echo "RECOVERY: repeated same-SHA failure cooldown is active; watchdog will re-check."
              ;;
            RERUN)
              CODE="$(curl -sS -o /tmp/rerun.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs")"
              case "${CODE}" in
                201|202)
                  echo "RECOVERY: rerun-failed-jobs accepted for run ${RUN_ID}."
                  verify_current_main_active
                  ;;
                *)
                  echo "RECOVERY: rerun failed with HTTP ${CODE}; falling back to fresh dispatch."
                  if [ -f /tmp/rerun.json ]; then cat /tmp/rerun.json; fi
                  DISPATCH_CODE="$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -d '{"ref":"main"}' \
                    "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/dispatches")"
                  if [ "${DISPATCH_CODE}" != "204" ]; then
                    echo "RECOVERY: fresh dispatch failed with HTTP ${DISPATCH_CODE}."
                    if [ -f /tmp/dispatch.json ]; then cat /tmp/dispatch.json; fi
                    exit 1
                  fi
                  echo "RECOVERY: fresh 9H workflow dispatch accepted."
                  verify_current_main_active
                  ;;
              esac
              ;;
            DISPATCH)
              while IFS= read -r STALE_CURRENT_RUN_ID; do
                [ -z "${STALE_CURRENT_RUN_ID}" ] && continue
                CANCEL_CODE="$(curl -sS -o /tmp/cancel-stale-current-dispatch.json -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_CURRENT_RUN_ID}/cancel")"
                case "${CANCEL_CODE}" in
                  202|409)
                    echo "RECOVERY: cancelled/conflicted over-age current-main run ${STALE_CURRENT_RUN_ID} before fresh dispatch."
                    ;;
                  *)
                    echo "RECOVERY: failed to cancel over-age current-main run ${STALE_CURRENT_RUN_ID} before fresh dispatch (HTTP ${CANCEL_CODE})."
                    if [ -f /tmp/cancel-stale-current-dispatch.json ]; then cat /tmp/cancel-stale-current-dispatch.json; fi
                    exit 1
                    ;;
                esac
              done < <(cancel_stale_current_main_runs)

              while IFS= read -r STALE_RUN_ID; do
                [ -z "${STALE_RUN_ID}" ] && continue
                CANCEL_CODE="$(curl -sS -o /tmp/cancel.json -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/cancel")"
                case "${CANCEL_CODE}" in
                  202|409)
                    echo "RECOVERY: obsolete run ${STALE_RUN_ID} cancel request accepted/conflicted safely."
                    ;;
                  *)
                    echo "RECOVERY: failed to cancel obsolete run ${STALE_RUN_ID} (HTTP ${CANCEL_CODE})."
                    if [ -f /tmp/cancel.json ]; then cat /tmp/cancel.json; fi
                    exit 1
                    ;;
                esac
              done < <(cancel_obsolete_runs)

              CODE="$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d '{"ref":"main"}' \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-9h-autonomous.yml/dispatches")"
              case "${CODE}" in
                204)
                  echo "RECOVERY: fresh 9H workflow dispatch accepted."
                  verify_current_main_active
                  ;;
                409)
                  echo "RECOVERY: dispatch conflict; another controller/run likely won the race."
                  ;;
                *)
                  echo "RECOVERY: dispatch failed with HTTP ${CODE}."
                  if [ -f /tmp/dispatch.json ]; then cat /tmp/dispatch.json; fi
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "RECOVERY: unknown controller state: ${DECISION}"
              exit 1
              ;;
          esac
