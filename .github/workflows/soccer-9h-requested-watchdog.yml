name: Soccer 9H Requested Watchdog

on:
  workflow_run:
    workflows: ["Soccer 9H Autonomous Research"]
    types: [requested]

permissions:
  actions: write

concurrency:
  group: soccer-9h-requested-watchdog-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor requested 9H runner allocation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Replace stuck pending 9H run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          get_main_sha() {
            curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          }

          for poll in $(seq 1 23); do
            MAIN_SHA="$(get_main_sha)"
            RUN_JSON="$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID")"
            printf '%s' "$RUN_JSON" > /tmp/9h-requested.json
            STATE="$(python -c 'import json; print(json.load(open("/tmp/9h-requested.json")).get("status") or "")')"
            CREATED_AT="$(python -c 'import json; print(json.load(open("/tmp/9h-requested.json")).get("created_at") or "")')"

            case "$STATE" in
              in_progress|completed)
                echo "Requested run $REQUESTED_RUN_ID left the pre-run state: $STATE."
                exit 0
                ;;
              pending|queued|waiting|requested)
                ;;
              *)
                echo "Unexpected state=$STATE; normal recovery remains authoritative."
                exit 0
                ;;
            esac

            if python - "$CREATED_AT" <<'PY'
import sys
from datetime import datetime, timezone
raw = sys.argv[1]
if not raw:
    raise SystemExit(1)
try:
    age_minutes = (datetime.now(timezone.utc) - datetime.fromisoformat(raw.replace("Z", "+00:00"))).total_seconds() / 60.0
except ValueError:
    raise SystemExit(1)
raise SystemExit(0 if age_minutes >= 20.0 else 1)
PY
            then
              echo "Run $REQUESTED_RUN_ID stayed $STATE for >=20m; replacing it with latest main $MAIN_SHA."
              CANCEL_CODE="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o /tmp/cancel.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID/cancel")"
              case "$CANCEL_CODE" in
                202|409) echo "Cancel accepted/conflicted (HTTP $CANCEL_CODE)." ;;
                *) echo "Cancel failed with HTTP $CANCEL_CODE." >&2; cat /tmp/cancel.json || true; exit 1 ;;
              esac

              DISPATCH_CODE="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"ref":"main"}' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/soccer-9h-autonomous.yml/dispatches")"
              if [ "$DISPATCH_CODE" != "204" ]; then
                echo "Replacement dispatch failed with HTTP $DISPATCH_CODE." >&2
                cat /tmp/dispatch.json || true
                exit 1
              fi

              for verify in $(seq 1 30); do
                sleep 5
                VERIFY_JSON="$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/soccer-9h-autonomous.yml/runs?branch=main&per_page=30")"
                if VERIFY_MAIN_SHA="$MAIN_SHA" VERIFY_JSON_TEXT="$VERIFY_JSON" python - <<'PY'
import json, os
payload = json.loads(os.environ["VERIFY_JSON_TEXT"])
main_sha = os.environ["VERIFY_MAIN_SHA"]
active = {"pending", "queued", "waiting", "requested", "in_progress"}
found = any(r.get("head_branch") == "main" and r.get("head_sha") == main_sha and r.get("status") in active for r in payload.get("workflow_runs", []))
raise SystemExit(0 if found else 1)
PY
                then
                  echo "Verified active current-main 9H replacement."
                  exit 0
                fi
              done

              echo "Replacement dispatch accepted but active current-main run was not observed." >&2
              exit 1
            fi

            sleep 60
          done

          echo "Requested-watchdog monitor window ended without a terminal state." >&2
          exit 1
