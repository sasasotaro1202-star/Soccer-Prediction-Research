name: Soccer 9H Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: soccer-9h-watchdog
  cancel-in-progress: false

jobs:
  ensure-research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure a 9H research cycle is active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          active_count=""
          for attempt in 1 2 3; do
            if active_count="$(
              gh run list                 --repo "$GH_REPO"                 --workflow "soccer-9h-autonomous.yml"                 --limit 50                 --json status                 --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
            )"; then
              break
            fi
            echo "Run-list attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done

          if [[ ! "$active_count" =~ ^[0-9]+$ ]]; then
            echo "Unable to verify active cycle state after retries."
            exit 1
          fi

          echo "Active soccer-9h cycles: $active_count"

          if [ "$active_count" -eq 0 ]; then
            for attempt in 1 2 3; do
              if gh workflow run "soccer-9h-autonomous.yml" --repo "$GH_REPO" --ref main; then
                echo "Fresh main-branch 9H cycle dispatched."
                exit 0
              fi
              echo "Dispatch attempt $attempt failed; retrying."
              sleep $((attempt * 5))
            done
            echo "Unable to dispatch a fresh cycle after retries."
            exit 1
          fi

          echo "An existing cycle is active; no duplicate dispatch."
