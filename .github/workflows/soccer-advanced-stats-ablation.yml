name: Soccer Advanced Statistics OOS Ablation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/advanced_stats_ablation.py"
      - "tests/test_advanced_stats_ablation.py"
      - "src/features/soccer_features.py"
      - "src/data/global_datalake_adapter.py"
      - ".github/workflows/soccer-advanced-stats-ablation.yml"
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Research start year"
        required: false
        default: "2012"
      end_year:
        description: "Research end year"
        required: false
        default: "2025"

permissions:
  contents: read

concurrency:
  group: soccer-advanced-stats-ablation
  cancel-in-progress: false

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 pyarrow

      - name: Run ablation unit tests
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q tests/test_advanced_stats_ablation.py

      - name: Run chronological OOS ablation
        env:
          PYTHONPATH: .
          START_YEAR: ${{ inputs.start_year || '2012' }}
          END_YEAR: ${{ inputs.end_year || '2025' }}
        run: |
          set -euo pipefail
          python -m src.research.advanced_stats_ablation | tee artifacts/advanced_stats_ablation_stdout.json

      - name: Validate research-only output
        run: |
          set -euo pipefail
          test -s artifacts/advanced_stats_ablation/oos_metrics_by_variant.csv
          test -s artifacts/advanced_stats_ablation/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/advanced_stats_ablation/status.json").read_text())
          if x.get("status") != "OK":
              raise SystemExit("ablation status is not OK")
          if x.get("production_status") != "RESEARCH_ONLY":
              raise SystemExit("ablation output cannot be treated as production")
          for key in (
              "logloss_delta_advanced_minus_baseline",
              "brier_delta_advanced_minus_baseline",
              "accuracy_delta_advanced_minus_baseline",
              "ece_delta_advanced_minus_baseline",
          ):
              value = x["delta"].get(key)
              if not isinstance(value, (int, float)):
                  raise SystemExit(f"missing finite delta: {key}")
          PY

      - name: Upload ablation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-advanced-stats-ablation-${{ github.run_id }}
          path: artifacts/advanced_stats_ablation/
          retention-days: 7
          if-no-files-found: warn
