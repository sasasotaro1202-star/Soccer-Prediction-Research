name: Soccer Coverage Fixture PIT Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

concurrency:
  group: soccer-coverage-pit-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python -m pip install -r requirements.txt && exit 0
            echo "dependency install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Run audit with diagnostic preservation
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m src.data.fixture_field_audit 2>&1 | tee artifacts/audit_stdout.log
      - name: Validate audit completeness
        if: always()
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/audit_summary.json')
          if not p.exists():
              raise SystemExit('audit_summary.json was not produced')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, ensure_ascii=False))
          if data.get('target_competition_count') != 14:
              raise SystemExit('Target competition count is not 14')
          if data.get('no_missing_to_zero') is not True:
              raise SystemExit('Missing-to-zero policy was not asserted')
          if data.get('search_engines_are_not_dataset_sources') is not True:
              raise SystemExit('Search engines were not explicitly excluded as datasets')
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-coverage-pit-audit-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
