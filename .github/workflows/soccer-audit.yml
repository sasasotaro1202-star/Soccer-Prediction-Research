name: Soccer Coverage Fixture PIT Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

concurrency:
  group: soccer-coverage-pit-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python -m pip install -r requirements.txt && exit 0
            echo "dependency install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Run audit with diagnostic preservation
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m src.data.fixture_field_audit 2>&1 | tee artifacts/audit_stdout.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "${rc}" > artifacts/audit_exit_code.txt
      - name: Validate audit completeness and record gate state
        if: always()
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifacts = Path('artifacts')
          p = artifacts / 'audit_summary.json'
          rc_path = artifacts / 'audit_exit_code.txt'
          try:
              rc = int(rc_path.read_text(encoding='utf-8').strip()) if rc_path.exists() else 99
          except ValueError:
              rc = 99

          if not p.exists():
              fallback = {
                  'target_competition_count': 15,
                  'audit_execution_ok': False,
                  'audit_exit_code': rc,
                  'coverage_scope_complete': False,
                  'pit_publication_time_gate': False,
                  'full_gate_passed': False,
                  'operational_workflow_status': 'DEGRADED_AUDIT_NO_SUMMARY',
              }
              (artifacts / 'audit_summary_fallback.json').write_text(
                  json.dumps(fallback, indent=2, ensure_ascii=False), encoding='utf-8'
              )
              print(json.dumps(fallback, indent=2, ensure_ascii=False))
              raise SystemExit(0)

          data = json.loads(p.read_text(encoding='utf-8'))
          data['audit_exit_code'] = rc
          data['operational_workflow_status'] = 'AUDIT_OK' if rc == 0 else 'DEGRADED_AUDIT'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(data, indent=2, ensure_ascii=False))

          # These are integrity invariants, not production-adoption gates.
          # Production eligibility remains fail-closed in the research workflow.
          if data.get('target_competition_count') != 15:
              raise SystemExit('Target competition count is not 14')
          if data.get('no_missing_to_zero') is not True:
              raise SystemExit('Missing-to-zero policy was not asserted')
          if data.get('search_engines_are_not_dataset_sources') is not True:
              raise SystemExit('Search engines were not explicitly excluded as datasets')
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: soccer-coverage-pit-audit-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
