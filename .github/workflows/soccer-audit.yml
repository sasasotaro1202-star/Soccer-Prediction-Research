name: Soccer Coverage Fixture PIT Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

concurrency:
  group: soccer-coverage-pit-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run audit
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python -m src.data.fixture_field_audit > artifacts/audit_stdout.json
      - name: Validate audit completeness
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/audit_summary.json')
          if not p.exists():
              raise SystemExit('audit_summary.json was not produced')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, ensure_ascii=False))
          if data.get('target_competition_count') != 14:
              raise SystemExit('Target competition count is not 14')
          if data.get('no_missing_to_zero') is not True:
              raise SystemExit('Missing-to-zero policy was not asserted')
          if data.get('search_engines_are_not_dataset_sources') is not True:
              raise SystemExit('Search engines were not explicitly excluded as datasets')
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soccer-coverage-pit-audit-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
