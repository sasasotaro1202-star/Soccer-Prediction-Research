name: Soccer Autonomous Orchestrator

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: soccer-autonomous-orchestrator
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile scheduled research and recovery lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reconcile and catch up
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api "$@"
          }

          now_epoch="$(date +%s)"
          main_sha="$(api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          export MAIN_SHA="${main_sha}"
          dispatch_budget=6
          dispatched_count=0
          max_active_runs=10
          report="autonomous-orchestrator-report.json"

          python - <<'PY' > "$report"
          import json, os
          payload = {
              "controller": "Soccer Autonomous Orchestrator",
              "main_sha": os.environ["MAIN_SHA"],
              "production_change_allowed": False,
              "frozen_holdout_access_allowed": False,
              "performance_claim_allowed": False,
              "dispatched": [],
              "held": [],
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          active_current_main_count() {
            gh run list --repo "${GH_REPO}" --limit 100 --json status,headSha \
              --jq --arg main_sha "${MAIN_SHA}" '[.[] | select(.headSha == $main_sha) | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length'
          }

          update_report() {
            python - "$report" "$1" "$2" <<'PY'
          import json, sys
          path, key, value = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          data[key].append(value)
          json.dump(data, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          }

          workflow_activation_state() {
            local workflow="$1"
            gh api "repos/${GH_REPO}/actions/workflows/${workflow}" --jq '.state'
          }

          ensure_workflow_active() {
            local workflow="$1"
            local state

            if ! state="$(workflow_activation_state "${workflow}")"; then
              return 1
            fi
            if [ "${state}" = "active" ]; then
              return 0
            fi

            echo "Workflow ${workflow} is ${state}; attempting bounded re-enable." >&2
            for attempt in 1 2 3; do
              if gh workflow enable "${workflow}" --repo "${GH_REPO}"; then
                if state="$(workflow_activation_state "${workflow}")" && [ "${state}" = "active" ]; then
                  return 0
                fi
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          workflow_state() {
            local workflow="$1"
            gh run list --repo "${GH_REPO}" --workflow "${workflow}" --limit 50 \
              --json status,conclusion,createdAt,headSha,headBranch,databaseId
          }

          dispatch_workflow() {
            local workflow="$1"
            for attempt in 1 2 3; do
              if case "${workflow}" in
                pit-replay-audit.yml)
                  # This lane has required workflow_dispatch inputs; use only its
                  # deterministic, audit-only defaults. No prediction is enabled.
                  gh workflow run "${workflow}" --repo "${GH_REPO}" --ref main \
                    -f competition=EPL \
                    -f rows_per_season=1
                  ;;
                *)
                  gh workflow run "${workflow}" --repo "${GH_REPO}" --ref main
                  ;;
              esac
              then
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          ensure_lane() {
            local workflow="$1"
            local cadence_minutes="$2"
            local min_gap_minutes="$3"

            if ! ensure_workflow_active "${workflow}"; then
              update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":"workflow_inactive_unrecoverable"},ensure_ascii=False))' "${workflow}")"
              return
            fi

            local runs
            if ! runs="$(workflow_state "${workflow}")"; then
              update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":"workflow_state_error"},ensure_ascii=False))' "${workflow}")"
              return
            fi

            local decision
            decision="$(
              python - "${runs}" "${main_sha}" "${now_epoch}" "${cadence_minutes}" "${min_gap_minutes}" <<'PY'
          import json, sys
          from datetime import datetime

          runs = json.loads(sys.argv[1])
          main_sha = sys.argv[2]
          now = int(sys.argv[3])
          cadence = int(sys.argv[4]) * 60
          min_gap = int(sys.argv[5]) * 60

          active_states = {"queued", "in_progress", "pending", "waiting", "requested"}
          same_main_active = [
              r for r in runs
              if r.get("headSha") == main_sha and r.get("status") in active_states
          ]
          if same_main_active:
              print("HOLD:active_current_main")
              raise SystemExit

          current_completed = [
              r for r in runs
              if r.get("status") == "completed"
              and r.get("createdAt")
              and r.get("headSha") == main_sha
          ]
          current_completed.sort(key=lambda r: r["createdAt"], reverse=True)

          latest_completed = current_completed[0] if current_completed else None
          if latest_completed is None:
              print("DISPATCH:no_current_main_history")
              raise SystemExit

          # Never allow an older success to mask a newer non-success.
          latest_conclusion = latest_completed.get("conclusion")
          if latest_conclusion == "success":
              latest = datetime.fromisoformat(
                  latest_completed["createdAt"].replace("Z", "+00:00")
              )
              age = now - int(latest.timestamp())
              if age < min_gap:
                  print("HOLD:recent")
              elif age >= cadence:
                  print("DISPATCH:stale")
              else:
                  print("HOLD:within_cadence")
              raise SystemExit

          if latest_conclusion in {"failure", "timed_out", "cancelled"}:
              # Avoid hammering a deterministically failing lane every 30 minutes.
              # Consecutive failures get bounded exponential backoff, capped at 24h.
              failures = []
              for r in current_completed:
                  if r.get("conclusion") in {"failure", "timed_out", "cancelled"}:
                      failures.append(r)
                  else:
                      break
              latest = datetime.fromisoformat(
                  failures[0]["createdAt"].replace("Z", "+00:00")
              )
              age_seconds = now - int(latest.timestamp())
              cooldown = min(24 * 3600, 3600 * (2 ** min(len(failures) - 1, 5)))
              if age_seconds < cooldown:
                  print(f"HOLD:failure_backoff:{cooldown}")
              else:
                  print("DISPATCH:retry_after_failure_backoff")
              raise SystemExit

          # Unknown/ambiguous terminal states fail closed instead of treating
          # any older success as cadence evidence.
          print(f"HOLD:unknown_terminal:{latest_conclusion or 'missing'}")
          raise SystemExit
          PY
            )"

            case "${decision}" in
              DISPATCH:*)
                if [ "${dispatched_count}" -ge "${dispatch_budget}" ]; then
                  update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":"dispatch_budget_exhausted"},ensure_ascii=False))' "${workflow}")"
                  return
                fi
                if ! active_count="$(active_current_main_count)"; then
                  update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":"active_current_main_count_error"},ensure_ascii=False))' "${workflow}")"
                  return
                fi
                if [ "${active_count}" -ge "${max_active_runs}" ]; then
                  update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":"active_current_main_cap","active_current_main_count":int(sys.argv[2])},ensure_ascii=False))' "${workflow}" "${active_count}")"
                  return
                fi
                if dispatch_workflow "${workflow}"; then
                  dispatched_count=$((dispatched_count + 1))
                  update_report dispatched "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":sys.argv[2],"dispatch_sequence":int(sys.argv[3])},ensure_ascii=False))' "${workflow}" "${decision}" "${dispatched_count}")"
                else
                  # One broken/disabled lane must not prevent later lanes from
                  # receiving its own catch-up opportunity. Preserve the
                  # dispatch failure as HOLD evidence and continue reconciliation.
                  update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":"dispatch_error"},ensure_ascii=False))' "${workflow}")"
                fi
                ;;
              *)
                update_report held "$(python -c 'import json,sys; print(json.dumps({"workflow":sys.argv[1],"reason":sys.argv[2]},ensure_ascii=False))' "${workflow}" "${decision}")"
                ;;
            esac
          }

          # High-frequency live lanes: these are catch-up guards only; their own schedules remain authoritative.
          ensure_lane "soccer-matchday-intelligence.yml" 30 15
          ensure_lane "soccer-daily-research-forecast.yml" 60 20

          # Core research lanes.
          ensure_lane "soccer-9h-autonomous.yml" 480 60
          ensure_lane "soccer-research-robust.yml" 1440 120
          ensure_lane "soccer-predictability-research.yml" 360 60
          ensure_lane "soccer-dynamic-simulator-research.yml" 360 60
          ensure_lane "soccer-prospective-inplay-capture.yml" 15 10
          ensure_lane "soccer-prospective-inplay-maturity.yml" 30 15
          ensure_lane "soccer-world-model-supervisor.yml" 120 30
          ensure_lane "soccer-historical-learning.yml" 360 90
          ensure_lane "soccer-experience-ledger.yml" 360 90
          ensure_lane "adaptive_data_discovery.yml" 360 60
          ensure_lane "soccer-scope-frontier.yml" 360 60

          # PIT/data integrity lanes.
          ensure_lane "pit-replay-audit.yml" 1440 120
          ensure_lane "soccer-coverage-pit-audit.yml" 1440 120
          ensure_lane "soccer-audit.yml" 1440 120
          ensure_lane "soccer-versioned-pit-research.yml" 720 120

          # Lower-frequency research lanes.
          ensure_lane "soccer-global-datalake.yml" 10080 240
          ensure_lane "soccer-mom-research.yml" 10080 240
          ensure_lane "full-catalog-audit.yml" 10080 240
          ensure_lane "soccer-source-probe.yml" 10080 120
          ensure_lane "soccer-research-cycle.yml" 10080 240
          ensure_lane "overnight-integrity.yml" 1440 120
          ensure_lane "soccer-opta-like-24h.yml" 1440 180
          ensure_lane "soccer-automation-integrity-audit.yml" 360 60

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("autonomous-orchestrator-report.json").read_text(encoding="utf-8"))
          print("## Soccer Autonomous Orchestrator")
          print(f"- main_sha: {s['main_sha']}")
          print(f"- dispatched: {len(s['dispatched'])}")
          print(f"- held: {len(s['held'])}")
          print("- dispatch_budget: 6")
          print("- max_active_runs: 10")
          print("- production_change_allowed: false")
          print("- frozen_holdout_access_allowed: false")
          print("- performance_claim_allowed: false")
          PY

      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-autonomous-orchestrator-${{ github.run_id }}
          path: autonomous-orchestrator-report.json
          retention-days: 14
