name: Soccer Control Plane Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: soccer-control-plane-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Keep autonomous control plane alive
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reconcile orchestrator liveness
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail

          CURL_TIMEOUT_ARGS=(--connect-timeout 20 --max-time 90)

          api_get() {
            curl "${CURL_TIMEOUT_ARGS[@]}" --retry 4 --retry-delay 2 --retry-all-errors -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          api_post() {
            local url="$1"
            local body="$2"
            local output="$3"
            for attempt in 1 2 3 4; do
              code="$(curl "${CURL_TIMEOUT_ARGS[@]}" -sS -o "${output}" -w "%{http_code}" -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 -d "${body}" "${url}")"
              case "${code}" in
                204|202) return 0 ;;
                409|429|500|502|503|504) sleep $((attempt * 3)) ;;
                *) cat "${output}" >&2; return 1 ;;
              esac
            done
            return 1
          }

          MAIN_SHA="$(api_get "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" |
            python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          export MAIN_SHA
          export DECISION

          api_get "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-autonomous-orchestrator.yml/runs?per_page=30" > /tmp/orchestrator-runs.json

          DECISION="$(python - /tmp/orchestrator-runs.json <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path("/tmp/orchestrator-runs.json").read_text())
          main_sha = os.environ["MAIN_SHA"]
          prestart = {"queued", "pending", "waiting", "requested"}

          def ts(run):
              raw = run.get("run_started_at") or run.get("updated_at") or run.get("created_at")
              if not raw:
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(raw.replace("Z", "+00:00"))

          now = datetime.now(timezone.utc)
          current_running = [
              r for r in payload.get("workflow_runs", [])
              if r.get("head_sha") == main_sha and r.get("status") == "in_progress"
          ]
          current_prestart = [
              r for r in payload.get("workflow_runs", [])
              if r.get("head_sha") == main_sha and r.get("status") in prestart
          ]

          # Do not repeatedly cancel/requeue a queued control-plane run. A queued
          # run is evidence that GitHub accepted the work; requeueing while the
          # hosted runner pool is busy only creates additional queue churn.
          if current_prestart:
              print("QUEUED_WAIT")
              raise SystemExit(0)

          if current_running:
              oldest = min(current_running, key=ts)
              age_min = (now - ts(oldest)).total_seconds() / 60.0
              print("RUNNING_STALE" if age_min >= 25 else "ACTIVE")
              raise SystemExit(0)

          current_completed = [
              r for r in payload.get("workflow_runs", [])
              if r.get("head_sha") == main_sha and r.get("status") == "completed"
          ]
          if not current_completed:
              print("DISPATCH")
              raise SystemExit(0)

          latest = max(current_completed, key=ts)
          age_min = (now - ts(latest)).total_seconds() / 60.0
          print("DISPATCH" if age_min >= 45 else "HEALTHY")
          PY
          )"

          cancel_run() {
            local run_id="$1"
            local out="/tmp/cancel-${run_id}.json"
            code="$(curl "${CURL_TIMEOUT_ARGS[@]}" -sS -o "${out}" -w "%{http_code}" -X POST               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")"
            case "${code}" in
              202|409) ;;
              *) cat "${out}" >&2; return 1 ;;
            esac
          }

          dispatch_orchestrator() {
            api_post "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/soccer-autonomous-orchestrator.yml/dispatches" '{"ref":"main"}' /tmp/dispatch.json
          }

          case "${DECISION}" in
            ACTIVE)
              echo "WATCHDOG: current-main orchestrator is healthy."
              ;;
            RUNNING_STALE)
              while IFS= read -r run_id; do
                [ -n "${run_id}" ] || continue
                cancel_run "${run_id}"
              done < <(
                python - /tmp/orchestrator-runs.json "${MAIN_SHA}" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          main_sha=sys.argv[2]
          for r in payload.get("workflow_runs", []):
              if r.get("head_sha")==main_sha and r.get("status")=="in_progress":
                  print(r.get("id"))
          PY
              )
              dispatch_orchestrator
              ;;
            QUEUED_WAIT)
              echo "WATCHDOG: current-main orchestrator is queued; preserve the accepted run and avoid requeue churn."
              ;;
            DISPATCH)
              dispatch_orchestrator
              ;;
            HEALTHY)
              echo "WATCHDOG: orchestrator recently reconciled current main."
              ;;
            *)
              echo "WATCHDOG: unknown decision ${DECISION}" >&2
              exit 1
              ;;
          esac

          mkdir -p watchdog-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "controller": "Soccer Control Plane Watchdog",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME"),
              "main_sha": os.environ["MAIN_SHA"],
              "decision": os.environ.get("DECISION", "unknown"),
              "production_change_allowed": False,
              "frozen_holdout_access_allowed": False,
              "performance_claim_allowed": False,
          }
          Path("watchdog-evidence/control_plane_watchdog.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Reconcile stale safe-hardening CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Only explicitly marked, same-repository hardening PRs may receive
          # bounded stale-CI recovery. Production/model/holdout changes never do.
          stale_after_seconds=4500
          max_recoveries=2
          recovery_count=0
          now_epoch="$(date +%s)"
          main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"

          mapfile -t pr_rows < <(
            gh pr list --repo "${GH_REPO}" --state open --base main --limit 50 \
              --json number,isDraft,baseRefOid,headRefName,headRefOid,headRepository,body \
              --jq '.[] | @base64'
          )

          for encoded in "${pr_rows[@]:-}"; do
            [ -n "${encoded}" ] || continue
            pr_json="$(printf "%s" "${encoded}" | base64 -d)"
            draft="$(jq -r '.isDraft' <<<"${pr_json}")"
            base_oid="$(jq -r '.baseRefOid' <<<"${pr_json}")"
            head_ref="$(jq -r '.headRefName' <<<"${pr_json}")"
            head_sha="$(jq -r '.headRefOid' <<<"${pr_json}")"
            head_repo="$(jq -r '.headRepository.nameWithOwner // ""' <<<"${pr_json}")"
            body="$(jq -r '.body // ""' <<<"${pr_json}")"
            number="$(jq -r '.number' <<<"${pr_json}")"

            [ "${draft}" = "false" ] || continue
            [ "${base_oid}" = "${main_sha}" ] || continue
            [ "${head_repo}" = "${GH_REPO}" ] || continue
            [[ "${head_ref}" == hardening/* ]] || continue
            grep -Fq "automation_policy: hardening-safe-v1" <<<"${body}" || continue
            grep -Fq "Production changed=False" <<<"${body}" || continue
            grep -Fq "No OOS tuning or holdout access" <<<"${body}" || continue
            grep -Fq "Candidate remains non-production" <<<"${body}" || continue
            grep -Fq "No model, feature, calibration, target, or production bundle change." <<<"${body}" || continue

            mapfile -t stale_runs < <(
              gh run list --repo "${GH_REPO}" --workflow ci.yml --limit 20 \
                --json databaseId,status,headSha,updatedAt,createdAt \
                --jq --arg head_sha "${head_sha}" --argjson now "${now_epoch}" --argjson stale "${stale_after_seconds}" \
                '[.[] | select(.headSha == $head_sha) | select(.status == "in_progress") | select((($now) - (.updatedAt | fromdateiso8601)) >= $stale) | .databaseId] | .[]'
            )

            for run_id in "${stale_runs[@]:-}"; do
              [ -n "${run_id}" ] || continue
              if [ "${recovery_count}" -ge "${max_recoveries}" ]; then
                echo "CI liveness recovery budget exhausted; preserving remaining stale runs." >&2
                break 2
              fi

              echo "Detected stale safe-hardening CI: PR #${number} run=${run_id} head=${head_sha}"
              cancelled=false
              for attempt in 1 2 3; do
                if gh run cancel "${run_id}" --repo "${GH_REPO}"; then
                  cancelled=true
                  break
                fi
                if [ "${attempt}" -lt 3 ]; then
                  sleep $((attempt * 5))
                fi
              done
              if [ "${cancelled}" != true ]; then
                echo "Could not cancel stale CI run ${run_id}; no rerun requested." >&2
                continue
              fi

              rerun=false
              for attempt in 1 2 3; do
                if gh run rerun "${run_id}" --repo "${GH_REPO}"; then
                  rerun=true
                  break
                fi
                if [ "${attempt}" -lt 3 ]; then
                  sleep $((attempt * 5))
                fi
              done
              if [ "${rerun}" = true ]; then
                recovery_count=$((recovery_count + 1))
                echo "Bounded CI liveness recovery requested for PR #${number} run=${run_id}."
              else
                echo "Stale CI cancelled but rerun request failed for PR #${number}; preserving failure signal." >&2
              fi
            done
          done

          echo "CI liveness recovery requests: ${recovery_count}/${max_recoveries}"
      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-control-plane-watchdog-${{ github.run_id }}
          path: watchdog-evidence/
          retention-days: 14
          if-no-files-found: warn
