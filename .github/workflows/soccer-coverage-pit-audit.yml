name: Soccer Coverage PIT Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 1"

permissions:
  contents: read

concurrency:
  group: soccer-coverage-pit-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q tests/test_fixture_field_audit.py tests/test_audit_completeness.py
      - name: Run coverage and PIT audit
        env:
          PYTHONPATH: .
          PIT_ENABLE_ARCHIVE_AUDIT: "0"
        run: |
          mkdir -p artifacts/coverage-pit-audit
          python -m src.data.fixture_field_audit > artifacts/coverage-pit-audit/audit_stdout.json
      - name: Validate completion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/coverage-pit-audit/audit_summary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, ensure_ascii=False))
          if data.get('target_competition_count') != 14:
              raise SystemExit('Target competition count is not 14')
          if not data.get('no_missing_to_zero', False):
              raise SystemExit('Missing-to-zero invariant failed')
          if data.get('search_engines_are_not_dataset_sources') is not True:
              raise SystemExit('Search-source invariant failed')
          PY
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-coverage-pit-audit-${{ github.run_id }}
          path: artifacts/coverage-pit-audit/
          retention-days: 30
          if-no-files-found: error
