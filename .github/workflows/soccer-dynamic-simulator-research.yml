name: Soccer Dynamic Simulator Research

on:
  push:
    branches: [main]
    paths:
      - "docs/HIERARCHICAL_DYNAMIC_SIMULATOR.md"
      - "config/dynamic_simulator_policy.json"
      - "src/research/dynamic_simulator_frontier.py"
      - "tests/test_dynamic_simulator_frontier.py"
      - ".github/workflows/soccer-dynamic-simulator-research.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: soccer-dynamic-simulator-research
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONHASHSEED: "0"

jobs:
  frontier:
    name: Hierarchical dynamic simulator frontier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${ github.sha }

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..."
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Compile frontier and tests
        run: python -m compileall -q src/research/dynamic_simulator_frontier.py tests/test_dynamic_simulator_frontier.py

      - name: Run frontier regression tests
        run: python -m pytest -q tests/test_dynamic_simulator_frontier.py

      - name: Build research status
        run: |
          set -euo pipefail
          python -m src.research.dynamic_simulator_frontier --out artifacts/dynamic_simulator_research
          test -s artifacts/dynamic_simulator_research/dynamic_simulator_frontier_status.json

      - name: Bridge research candidate PR #212
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${ github.token }
          GH_REPO: ${ github.repository }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dynamic_simulator_research
          bridge_status="HOLD"
          reason="candidate_pr_not_dispatched"
          if pr_json="$(gh pr view 212 --repo "${GH_REPO}" --json state,headRefName,title 2>/dev/null)"; then
            state="$(python -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<<"${pr_json}")"
            head_ref="$(python -c 'import json,sys; print(json.load(sys.stdin)["headRefName"])' <<<"${pr_json}")"
            if [ "${state}" = "OPEN" ] && [ -n "${head_ref}" ]; then
              if gh api "repos/${GH_REPO}/contents/.github/workflows/soccer-match-state-research.yml?ref=${head_ref}" >/dev/null 2>&1; then
                dispatched=false
                for attempt in 1 2 3; do
                  if gh workflow run soccer-match-state-research.yml --repo "${GH_REPO}" --ref "${head_ref}"; then
                    dispatched=true
                    break
                  fi
                  sleep $((attempt * 5))
                done
                if [ "${dispatched}" = true ]; then
                  bridge_status="DISPATCHED"
                  reason="open_research_candidate_workflow_dispatched"
                else
                  reason="candidate_workflow_dispatch_failed"
                fi
              else
                reason="candidate_workflow_not_present_on_pr_head"
              fi
            else
              reason="candidate_pr_not_open"
            fi
          else
            reason="candidate_pr_lookup_failed"
          fi
          python - "${bridge_status}" "${reason}" > artifacts/dynamic_simulator_research/candidate_bridge_status.json <<'PY'
          import json, sys
          print(json.dumps({
              "schema_version": 1,
              "status": sys.argv[1],
              "reason": sys.argv[2],
              "research_only": True,
              "production_changed": False,
              "production_usable": False,
              "promotion_allowed": False,
              "pr_number": 212,
              "workflow": "soccer-match-state-research.yml",
          }, indent=2, ensure_ascii=False))
          PY

      - name: Verify safety contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/dynamic_simulator_research")
          status = json.loads((root / "dynamic_simulator_frontier_status.json").read_text(encoding="utf-8"))
          checks = {
              "research_only": status.get("research_only") is True,
              "production_changed": status.get("production_changed") is False,
              "production_usable": status.get("production_usable") is False,
              "promotion_candidate": status.get("promotion_candidate") is False,
              "performance_verified": status.get("performance_verified") is False,
              "frozen_holdout_access_allowed": status.get("frozen_holdout_access_allowed") is False,
              "pit_required": status.get("pit_required") is True,
          }
          failures = [name for name, ok in checks.items() if not ok]
          if failures:
              raise SystemExit("DYNAMIC SIMULATOR SAFETY GATE FAILED: " + ", ".join(failures))
          print("dynamic_simulator_safety: PASS")
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-dynamic-simulator-research-${ github.run_id }
          path: artifacts/dynamic_simulator_research/
          retention-days: 14
          if-no-files-found: error
