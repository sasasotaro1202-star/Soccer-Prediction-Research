name: Soccer Dynamic Simulator Research

on:
  push:
    branches: [main]
    paths:
      - "docs/HIERARCHICAL_DYNAMIC_SIMULATOR.md"
      - "config/dynamic_simulator_policy.json"
      - "src/research/dynamic_simulator_frontier.py"
      - "tests/test_dynamic_simulator_frontier.py"
      - ".github/workflows/soccer-dynamic-simulator-research.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  actions: write
  contents: read

# Main is authoritative; the orchestrator also catches up this lane when schedules are missed.
concurrency:
  group: soccer-dynamic-simulator-research
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONHASHSEED: "0"

jobs:
  frontier:
    name: Hierarchical dynamic simulator frontier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..."
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Compile frontier and tests
        run: python -m compileall -q src/research/dynamic_simulator_frontier.py tests/test_dynamic_simulator_frontier.py

      - name: Run frontier regression tests
        run: python -m pytest -q tests/test_dynamic_simulator_frontier.py

      - name: Build research status
        run: |
          set -euo pipefail
          python -m src.research.dynamic_simulator_frontier --out artifacts/dynamic_simulator_research
          test -s artifacts/dynamic_simulator_research/dynamic_simulator_frontier_status.json

      - name: Dispatch current-main match-state research when frontier is ready
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status_file="artifacts/dynamic_simulator_research/dynamic_simulator_frontier_status.json"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status",""))' "$status_file")"
          case "$status" in
            DYNAMIC_MATCH_STATE_READY)
              gh workflow run "soccer-match-state-research.yml" --repo "$GITHUB_REPOSITORY" --ref main
              echo "DISPATCH current-main match-state research"
              ;;
            DYNAMIC_MATCH_STATE_WAITING|FOUNDATION_GAP|BLOCKED)
              echo "HOLD frontier status=$status"
              ;;
            *)
              echo "Unexpected frontier status=$status"
              exit 1
              ;;
          esac

      - name: Verify safety contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/dynamic_simulator_research")
          status = json.loads((root / "dynamic_simulator_frontier_status.json").read_text(encoding="utf-8"))
          checks = {
              "research_only": status.get("research_only") is True,
              "production_changed": status.get("production_changed") is False,
              "production_usable": status.get("production_usable") is False,
              "promotion_candidate": status.get("promotion_candidate") is False,
              "performance_verified": status.get("performance_verified") is False,
              "frozen_holdout_access_allowed": status.get("frozen_holdout_access_allowed") is False,
              "pit_required": status.get("pit_required") is True,
          }
          failures = [name for name, ok in checks.items() if not ok]
          if failures:
              raise SystemExit("DYNAMIC SIMULATOR SAFETY GATE FAILED: " + ", ".join(failures))
          print("dynamic_simulator_safety: PASS")
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-dynamic-simulator-research-${{ github.run_id }}
          path: artifacts/dynamic_simulator_research/
          retention-days: 14
          if-no-files-found: error
