name: Soccer Experience Ledger

on:
  workflow_run:
    workflows: ["Soccer Matchday Intelligence Refresh"]
    types: [completed]
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Completed-match history window to settle"
        required: false
        default: "14"

permissions:
  contents: write
  actions: read

concurrency:
  group: soccer-experience-ledger
  cancel-in-progress: false

jobs:
  settle:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
      - name: Download matchday prediction artifact when triggered by Matchday
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: soccer-matchday-intelligence-${{ github.event.workflow_run.id }}
          path: artifacts/matchday-source
      - name: Record newly generated prediction states
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -f artifacts/matchday-source/predictions.csv ]; then
            python -m scripts.experience_ledger record --predictions artifacts/matchday-source/predictions.csv --prediction-time "$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/matchday-source/prediction_status.json")
          if not p.exists():
              print("")
          else:
              print(json.loads(p.read_text()).get("prediction_time_utc", ""))
          PY
            )"
          elif [ -f artifacts/predictions.csv ]; then
            python -m scripts.experience_ledger record --predictions artifacts/predictions.csv
          else
            echo "No prediction artifact available; nothing to record."
          fi
      - name: Settle completed predictions and refresh metrics
        env:
          PYTHONPATH: .
          DAYS_BACK: ${{ inputs.days_back || '14' }}
        run: |
          set -euo pipefail
          python -m scripts.experience_ledger settle --days-back "$DAYS_BACK"
      - name: Generate durable experience status
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m scripts.experience_ledger status
          test -s artifacts/experience_status.json
          test -s artifacts/experience_metrics.csv
      - name: Learn from matured experience (PIT-safe Challenger)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m src.research.experience_learning --ledger data/experience/prediction_ledger.csv
          test -s artifacts/experience_learning_status.json
          test -s artifacts/experience_policy_candidate.json
      - name: Publish experience learning status to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s artifacts/experience_learning_status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("artifacts/experience_learning_status.json").read_text(encoding="utf-8"))
          print("## Experience learning")
          print(f"- Status={s.get('status')}")
          print(f"- Rows={s.get('rows', 0)}, Blocks={s.get('blocks', 0)}, Alpha={s.get('alpha', 'NA')}")
          gate = s.get("gate") or {}
          print(f"- Development improvement={gate.get('development_improvement', 'NA')}")
          print(f"- Locked pass={gate.get('locked_pass', 'NA')}")
          print(f"- Locked non-regressions={gate.get('locked_non_regressions', 'NA')}/{gate.get('locked_required', 'NA')}")
          print("- Production probabilities unchanged: true")
          PY
          else
            echo "## Experience learning" >> "$GITHUB_STEP_SUMMARY"
            echo "Experience learning status artifact unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit durable experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-experience-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            data/experience/prediction_ledger.csv \
            data/experience/prediction_snapshots.jsonl \
            artifacts/experience_metrics.csv \
            artifacts/experience_metrics_by_target.csv \
            artifacts/experience_status.json \
            artifacts/experience_learning_status.json \
            artifacts/experience_learning_oos.csv \
            artifacts/experience_learning_replay.csv \
            artifacts/experience_policy_candidate.json
          do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No experience changes to commit."
            exit 0
          fi
          git commit -m "ops: learn from matured prediction experience"
          git push origin HEAD:main
