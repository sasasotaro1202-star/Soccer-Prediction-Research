name: Soccer Experience Ledger

on:
  workflow_run:
    workflows: ["Soccer Matchday Intelligence Refresh"]
    types: [completed]
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Completed-match history window to settle"
        required: false
        default: "14"

permissions:
  contents: write
  actions: read

concurrency:
  group: soccer-experience-ledger
  cancel-in-progress: false

jobs:
  settle:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 45 }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt
      - name: Download matchday prediction artifact when triggered by Matchday
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: soccer-matchday-intelligence-${{ github.event.workflow_run.id }}
          path: artifacts/matchday-source
      - name: Record newly generated prediction states
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -f artifacts/matchday-source/predictions.csv ]; then
            PREDICTION_TIME="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/matchday-source/prediction_status.json")
          if not p.exists():
              print("")
          else:
              print(json.loads(p.read_text(encoding="utf-8")).get("prediction_time_utc", ""))
          PY
            )"
            if [ -s artifacts/matchday-source/forecast_uncertainty_shadow.csv ]; then
              python -m scripts.experience_ledger record                 --predictions artifacts/matchday-source/predictions.csv                 --prediction-time "$PREDICTION_TIME"                 --diagnostics artifacts/matchday-source/forecast_uncertainty_shadow.csv
            else
              python -m scripts.experience_ledger record                 --predictions artifacts/matchday-source/predictions.csv                 --prediction-time "$PREDICTION_TIME"
            fi
          elif [ -f artifacts/predictions.csv ] && [ -f artifacts/prediction_status.json ]; then
            python -m scripts.experience_ledger record \
              --predictions artifacts/predictions.csv \
              --prediction-time "$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/prediction_status.json")
          value = json.loads(p.read_text(encoding="utf-8")).get("prediction_time_utc", "")
          print(value)
          PY
            )"
          elif [ -f artifacts/predictions.csv ]; then
            echo "Prediction artifact exists but no explicit prediction time is available; refusing unknown PIT."
          else
            echo "No prediction artifact available; nothing to record."
          fi
      - name: Settle completed predictions and refresh metrics
        env:
          PYTHONPATH: .
          DAYS_BACK: ${{ inputs.days_back || '14' }}
        run: |
          set -euo pipefail
          python -m scripts.experience_ledger settle --days-back "$DAYS_BACK"
      - name: Generate durable experience status
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m scripts.experience_ledger status
          test -s artifacts/experience_status.json
          test -s artifacts/experience_metrics.csv
      - name: Learn from matured experience (PIT-safe Challenger)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m src.research.experience_learning --ledger data/experience/prediction_ledger.csv
          test -s artifacts/experience_learning_status.json
          test -s artifacts/experience_policy_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("artifacts/experience_learning_status.json").read_text(encoding="utf-8"))
          if status.get("status") == "BLOCKED_LEDGER_SCHEMA":
              raise SystemExit("experience learning is blocked by invalid ledger schema")
          print(f"experience learning status={status.get('status')}")
          PY

      - name: Learn target-specific matured experience (O-U and BTTS)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m src.research.target_experience_learning
          test -s artifacts/target_experience/target_experience_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("artifacts/target_experience/target_experience_status.json").read_text(encoding="utf-8"))
          target_status = status.get("status")
          if target_status == "BLOCKED_LEDGER_SCHEMA":
              raise SystemExit("target-specific experience learning is blocked by invalid ledger schema")
          print(f"target experience learning status={target_status}")
          PY
      - name: Generate matured-experience research candidates
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m scripts.generate_experience_candidates
          test -s artifacts/experience_candidate_plan.json
          test -s artifacts/experience_candidate_status.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("artifacts/experience_candidate_status.json").read_text(encoding="utf-8"))
          print("")
          print("## Experience research candidates")
          print(f"- Status={s.get('status')}")
          print(f"- Matured rows={s.get('settled_rows', 0)}")
          print(f"- Candidate count={s.get('candidate_count', 0)}")
          print("- Production changed=False")
          PY

      - name: Publish experience and learning status to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## Soccer performance" >> "$GITHUB_STEP_SUMMARY"
          if [ -s artifacts/experience_status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json
          from pathlib import Path
          status = json.loads(Path("artifacts/experience_status.json").read_text(encoding="utf-8"))
          summary = status.get("summary") or {}
          deltas = status.get("metric_deltas_vs_previous") or {}
          print(
              f"- **Settlement verification**: dual-source={status.get('dual_source_agree_predictions', 0)}, "
              f"source-disagreement={status.get('source_disagreement_predictions', 0)}"
          )
          for scope in ("all", "30d", "7d"):
              row = summary.get(scope)
              if not isinstance(row, dict):
                  continue
              print(f"- **{scope} / 1X2**: n={row.get('n', 0)}, Accuracy={row.get('1x2_accuracy_pct', 'NA')}%, LogLoss={row.get('logloss', 'NA')}, Brier={row.get('brier', 'NA')}, RPS={row.get('rps', 'NA')}, ECE={row.get('ece', 'NA')}")
              if scope in deltas:
                  print(f"  - **1X2 changed vs previous**: {deltas[scope]}")
          target_path = Path("artifacts/experience_metrics_by_target.csv")
          if target_path.is_file() and target_path.stat().st_size:
              print("")
              print("## Target-specific performance")
              with target_path.open(encoding="utf-8", newline="") as fh:
                  rows = list(csv.DictReader(fh))
              for target in ("1X2", "Score", "O/U", "BTTS", "MOM"):
                  selected = [r for r in rows if r.get("scope") == "all" and r.get("target") == target]
                  if not selected:
                      print(f"- **{target}**: insufficient settled evidence")
                      continue
                  metrics = [f"{r.get('metric')}={r.get('accuracy_pct')}% (n={r.get('n')})" for r in selected]
                  print(f"- **{target}**: " + ", ".join(metrics))
          else:
              print("- **Target-specific performance**: artifact unavailable")
          metrics_path = Path("artifacts/experience_metrics.csv")
          print("")
          print("## Range breakdown (1X2)")
          if metrics_path.is_file() and metrics_path.stat().st_size:
              with metrics_path.open(encoding="utf-8", newline="") as fh:
                  rows = list(csv.DictReader(fh))
              for scope in ("competition", "season", "phase", "tier", "competition_type", "region", "regime", "confidence", "uncertainty", "horizon", "data_quality"):
                  selected = [r for r in rows if r.get("scope") == scope]
                  if not selected:
                      continue
                  print(f"- **{scope}**:")
                  for r in selected:
                      print(
                          f"  - {r.get('segment')}: n={r.get('n')}, "
                          f"Accuracy={r.get('1x2_accuracy_pct')}%, LogLoss={r.get('logloss')}, "
                          f"Brier={r.get('brier')}, ECE={r.get('ece')}"
                      )
          else:
              print("- Range breakdown unavailable")
          if not deltas:
              print("- **No 1X2 metric change vs previous durable status detected.**")
          PY
          else
            echo "- No durable experience performance status was generated in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Experience learning" >> "$GITHUB_STEP_SUMMARY"
          if [ -s artifacts/experience_learning_status.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("artifacts/experience_learning_status.json").read_text(encoding="utf-8"))
          print(f"- Status={s.get('status')}")
          print(f"- Rows={s.get('rows', 0)}, Blocks={s.get('blocks', 0)}, Alpha={s.get('alpha', 'NA')}")
          gate = s.get("gate") or {}
          print(f"- Development improvement={gate.get('development_improvement', 'NA')}")
          print(f"- Locked pass={gate.get('locked_pass', 'NA')}")
          print(f"- Locked non-regressions={gate.get('locked_non_regressions', 'NA')}/{gate.get('locked_required', 'NA')}")
          print("- Production probabilities unchanged: true")
          PY
          else
            echo "- Experience learning status artifact unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit durable experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-experience-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            data/experience/prediction_ledger.csv \
            data/experience/prediction_snapshots.jsonl \
            artifacts/experience_metrics.csv \
            artifacts/experience_metrics_by_target.csv \
            artifacts/experience_status.json \
            artifacts/experience_learning_status.json \
            artifacts/experience_learning_oos.csv \
            artifacts/experience_learning_replay.csv \
            artifacts/experience_policy_candidate.json \
            artifacts/target_experience/target_experience_status.json \
            artifacts/target_experience/target_experience_oos.csv \
            artifacts/experience_candidate_plan.json \
            artifacts/experience_candidate_status.json
          do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No experience changes to commit."
            exit 0
          fi

          SEMANTIC_CHANGE="$(
            python -m scripts.experience_commit_guard \
              data/experience/prediction_ledger.csv \
              data/experience/prediction_snapshots.jsonl \
              artifacts/experience_metrics.csv \
              artifacts/experience_metrics_by_target.csv \
              artifacts/experience_status.json \
              artifacts/experience_learning_status.json \
              artifacts/experience_learning_oos.csv \
              artifacts/experience_learning_replay.csv \
              artifacts/experience_policy_candidate.json \
              artifacts/target_experience/target_experience_status.json \
              artifacts/target_experience/target_experience_oos.csv \
              artifacts/experience_candidate_plan.json \
              artifacts/experience_candidate_status.json
          )"
          if [ "$SEMANTIC_CHANGE" != "true" ]; then
            git reset --               data/experience/prediction_ledger.csv               data/experience/prediction_snapshots.jsonl               artifacts/experience_metrics.csv               artifacts/experience_metrics_by_target.csv               artifacts/experience_status.json               artifacts/experience_learning_status.json               artifacts/experience_learning_oos.csv               artifacts/experience_learning_replay.csv               artifacts/experience_policy_candidate.json               artifacts/target_experience/target_experience_status.json               artifacts/target_experience/target_experience_oos.csv               artifacts/experience_candidate_plan.json               artifacts/experience_candidate_status.json
            echo "Only volatile generated_at_utc metadata changed; skipping empty experience commit."
            exit 0
          fi

          git commit -m "ops: learn from matured prediction experience"
          git push origin HEAD:main