name: Soccer Experience Ledger

on:
  workflow_run:
    workflows: ["Soccer Matchday Intelligence Refresh"]
    types: [completed]
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Completed-match history window to settle"
        required: false
        default: "14"

permissions:
  contents: write
  actions: read

concurrency:
  group: soccer-experience-ledger
  cancel-in-progress: false

jobs:
  settle:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
      - name: Download matchday prediction artifact when triggered by Matchday
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: soccer-matchday-intelligence-${{ github.event.workflow_run.id }}
          path: artifacts/matchday-source
      - name: Record newly generated prediction states
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -f artifacts/matchday-source/predictions.csv ]; then
            python -m scripts.experience_ledger record               --predictions artifacts/matchday-source/predictions.csv               --prediction-time "$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/matchday-source/prediction_status.json")
          if not p.exists():
              print("")
          else:
              print(json.loads(p.read_text()).get("prediction_time_utc", ""))
          PY
            )"
          elif [ -f artifacts/predictions.csv ]; then
            python -m scripts.experience_ledger record --predictions artifacts/predictions.csv
          else
            echo "No prediction artifact available; nothing to record."
          fi
      - name: Settle completed predictions and refresh metrics
        env:
          PYTHONPATH: .
          DAYS_BACK: ${{ inputs.days_back || '14' }}
        run: |
          set -euo pipefail
          python -m scripts.experience_ledger settle --days-back "$DAYS_BACK"
      - name: Publish experience metrics to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifacts/experience_status.json ]; then
            echo "## Soccer performance" >> "$GITHUB_STEP_SUMMARY"
            echo "No durable experience status was generated in this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status = json.loads(Path("artifacts/experience_status.json").read_text(encoding="utf-8"))
          summary = status.get("summary") or {}
          deltas = status.get("metric_deltas_vs_previous") or {}
          print("## Soccer performance")
          for scope in ("all", "30d", "7d"):
              row = summary.get(scope)
              if not isinstance(row, dict): continue
              print(f"- **{scope}**: n={row.get('n', 0)}, 1X2={row.get('1x2_accuracy_pct', 'NA')}%, LogLoss={row.get('logloss', 'NA')}, Brier={row.get('brier', 'NA')}, RPS={row.get('rps', 'NA')}, ECE={row.get('ece', 'NA')}")
              if scope in deltas: print(f"  - **changed vs previous**: {deltas[scope]}")
          if not deltas: print("- **No metric change vs previous durable status detected.**")
          PY
      - name: Commit durable experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-experience-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            data/experience/prediction_ledger.csv \
            artifacts/experience_metrics.csv \
            artifacts/experience_status.json
          do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No experience changes to commit."
            exit 0
          fi
          git commit -m "ops: persist prediction experience and performance metrics"
          git push origin HEAD:main
