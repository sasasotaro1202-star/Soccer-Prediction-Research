name: Soccer J1 Imminent Research Forecast

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: soccer-j1-imminent-research-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 90 -r requirements.txt

      - name: Verify research forecast unit contract
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q tests/test_live_research_forecast.py

      - name: Generate J1 imminent research forecast
        env:
          PYTHONPATH: .
          LIVE_FORECAST_CONFIG: config/j1_imminent_research_forecast.json
        run: |
          set -euo pipefail
          python -m src.prediction.live_research_forecast \
            --output artifacts/j1_imminent_research_predictions.csv \
            --status artifacts/j1_imminent_research_prediction_status.json \
            --verify

      - name: Publish research forecast to Step Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          print("## J1 Imminent Research Forecast")
          print("")
          print("Research-only Elo + Poisson heuristic. This lane is not Production and does not establish OOS, calibration, robustness, or adoption evidence.")
          status_path = Path("artifacts/j1_imminent_research_prediction_status.json")
          if status_path.exists():
              s = json.loads(status_path.read_text(encoding="utf-8"))
              print("- Status: **{}**".format(s.get("status")))
              print("- Prediction time (UTC): `{}`".format(s.get("prediction_time_utc")))
              print("- Model: `{}`".format(s.get("model_status")))
              print("- Production: `{}`".format(s.get("production_status")))
          path = Path("artifacts/j1_imminent_research_predictions.csv")
          if not path.exists() or path.stat().st_size == 0:
              print("- No forecast rows.")
              raise SystemExit(0)
          frame = pd.read_csv(path)
          for _, r in frame.iterrows():
              print("")
              print("### {} vs {}".format(r["home_team"], r["away_team"]))
              print("- Kickoff (UTC): `{}` / state `{}`".format(r["kickoff_utc"], r["prediction_state"]))
              print("- 1X2: Home {:.1%} / Draw {:.1%} / Away {:.1%}".format(r["p_home"], r["p_draw"], r["p_away"]))
              print("- Pick: **{}**".format(r["result_prediction"]))
              print("- Score Top3: {} ({:.1%}), {} ({:.1%}), {} ({:.1%})".format(r["score_1"], r["score_1_probability"], r["score_2"], r["score_2_probability"], r["score_3"], r["score_3_probability"]))
              print("- Predictability: {:.1%} / Uncertainty: {:.1%}".format(r["predictability"], r["uncertainty"]))
              print("- PIT: `{}` / Production: `{}`".format(r["pit_status"], r["production_status"]))
          PY

      - name: Upload J1 research artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-j1-imminent-research-forecast
          path: |
            artifacts/j1_imminent_research_predictions.csv
            artifacts/j1_imminent_research_prediction_status.json
          retention-days: 2