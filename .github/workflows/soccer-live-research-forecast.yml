name: Soccer Live Research Forecast

on:
  push:
    paths:
      - "src/prediction/live_research_forecast.py"
      - "tests/test_live_research_forecast.py"
      - ".github/workflows/soccer-live-research-forecast.yml"
      - "requirements.txt"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: soccer-live-research-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 90 -r requirements.txt

      - name: Verify live research unit contract
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest -q tests/test_live_research_forecast.py

      - name: Generate live research forecast
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m src.prediction.live_research_forecast \
            --output artifacts/live_research_predictions.csv \
            --status artifacts/live_research_prediction_status.json \
            --verify

      - name: Publish forecast to Step Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          print("## Soccer Live Research Forecast")
          status_path = Path("artifacts/live_research_prediction_status.json")
          if status_path.exists():
              s = json.loads(status_path.read_text(encoding="utf-8"))
              print(f"- Status: **{s.get('status')}**")
              print(f"- Prediction time (UTC): `{s.get('prediction_time_utc')}`")
              print(f"- Model: `{s.get('model_status')}`")
              print(f"- Production: `{s.get('production_status')}`")
          path = Path("artifacts/live_research_predictions.csv")
          if not path.exists() or path.stat().st_size == 0:
              print("- No forecast rows.")
              raise SystemExit(0)
          frame = pd.read_csv(path)
          for _, r in frame.iterrows():
              print("")
              print(f"### {r['home_team']} vs {r['away_team']}")
              print(f"- State: `{r['prediction_state']}` / match status `{r['match_status']}`")
              print(f"- Current score: **{int(r['current_home_goals'])}-{int(r['current_away_goals'])}** at {r['elapsed_minutes']:.1f} min")
              print(f"- 1X2: Home {r['p_home']:.1%} / Draw {r['p_draw']:.1%} / Away {r['p_away']:.1%}")
              print(f"- Pick: **{r['result_prediction']}**")
              print(f"- Top scores: {r['score_1']} ({r['score_1_probability']:.1%}), {r['score_2']} ({r['score_2_probability']:.1%}), {r['score_3']} ({r['score_3_probability']:.1%})")
              print(f"- Predictability: {r['predictability']:.1%} / Uncertainty: {r['uncertainty']:.1%}")
              print(f"- PIT: `{r['pit_status']}` / Production: `{r['production_status']}`")
          PY

      - name: Upload forecast artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-live-research-forecast-${{ github.run_id }}
          path: |
            artifacts/live_research_predictions.csv
            artifacts/live_research_prediction_status.json
          retention-days: 1
