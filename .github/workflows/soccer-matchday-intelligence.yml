name: Soccer Matchday Intelligence Refresh

on:
  workflow_run:
    workflows: ["Soccer 9H Autonomous Research"]
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: "UTC days of fixture snapshots to collect"
        required: false
        default: "2"
      horizon_hours:
        description: "Detailed refresh horizon around kickoff"
        required: false
        default: "12"
      prediction_mode:
        description: "scheduled_1h = automatic one-hour timing; on_demand = manual forecast at current time"
        required: false
        default: "on_demand"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: soccer-matchday-intelligence
  # A scheduled refresh must finish; do not cancel an in-flight snapshot
  # merely because the next 15-minute tick arrived.
  cancel-in-progress: false

jobs:
  refresh:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Manual/on-demand runs get the maximum GitHub-hosted job budget; scheduled
    # and workflow_run refreshes keep the existing short operational bound.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Refresh current matchday intelligence
        env:
          PYTHONPATH: .
          DAYS: ${{ inputs.days || '2' }}
          HORIZON_HOURS: ${{ inputs.horizon_hours || '12' }}
        run: |
          set -euo pipefail
          python -m src.data.matchday_intelligence_fetch \
            --days "${DAYS}" \
            --horizon-hours "${HORIZON_HOURS}" \
            --output artifacts/future_matchday_fixtures.csv \
            --status artifacts/matchday_intelligence_status.json
      - name: Validate snapshot contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          status = json.loads(Path("artifacts/matchday_intelligence_status.json").read_text())
          frame = pd.read_csv("artifacts/future_matchday_fixtures.csv")
          required = {
              "match_id", "kickoff_utc", "home_team", "away_team",
              "source_available_at_utc", "pit_verified", "starter_status",
              "matchday_available_at_utc", "matchday_pit_verified",
          }
          missing = sorted(required - set(frame.columns))
          if missing:
              raise SystemExit(f"matchday snapshot missing required columns: {missing}")
          if status.get("global_event_cap_enabled") is True:
              raise SystemExit("unexpected global matchday event cap is enabled; refusing potentially truncated scope")
          if frame["match_id"].duplicated().any():
              raise SystemExit("duplicate match_id in matchday snapshot")
          allowed_status = {"EXPECTED", "ANNOUNCED", "CONFIRMED"}
          actual_status = set(frame["starter_status"].dropna().astype(str).str.upper())
          if not actual_status <= allowed_status:
              raise SystemExit(f"unexpected starter_status values: {sorted(actual_status - allowed_status)}")
          print({"status": status.get("status"), "rows": len(frame), "errors": len(status.get("errors", []))})
          PY
      - name: Publish active target coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("artifacts/matchday_intelligence_status.json")
          print("## Active target coverage")
          if not p.exists():
              print("- Status artifact unavailable")
              raise SystemExit(0)
          status = json.loads(p.read_text(encoding="utf-8"))
          coverage = status.get("active_target_coverage") or {}
          print(f"- Active targets: {coverage.get('active_target_count', 0)}")
          print(f"- Targets with upcoming fixtures in snapshot: {coverage.get('targets_with_upcoming_fixtures', 0)}")
          print(f"- Snapshot fixture presence: {coverage.get('upcoming_fixture_presence_pct', 'NA')}%")
          for competition, item in (coverage.get("per_competition") or {}).items():
              sources = ", ".join(item.get("sources") or []) or "none"
              print(f"- **{competition}**: rows={item.get('upcoming_rows', 0)}, sources={sources}")
          PY
      - name: Prepare PIT-safe future fixture features
        if: success()
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m src.prediction.prepare_fixtures             --fixtures artifacts/future_matchday_fixtures.csv             --output artifacts/future_fixtures.csv
      - name: Run current predictions when an adopted production model exists
        if: success()
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -s models/current/production_model.pkl ] && [ -s models/current/production_model.json ] && [ -s models/current/model_registry.json ] && [ -s models/current/production_provenance.json ]; then
            PREDICTION_MODE="${{ inputs.prediction_mode || 'scheduled_1h' }}"
            case "$PREDICTION_MODE" in
              scheduled_1h)
                echo "Automatic prediction mode: target 60 minutes before kickoff (±10 minutes)."
                python -m src.prediction.runner \
                  --fixtures artifacts/future_fixtures.csv \
                  --output artifacts/predictions.csv \
                  --status artifacts/prediction_status.json \
                  --model-policy production \
                  --prediction-window-minutes-before 60 \
                  --prediction-window-tolerance-minutes 10
                ;;
              on_demand)
                echo "Manual/on-demand prediction mode: no fixed timing window; kickoff must still be in the future and PIT gates remain mandatory."
                python -m src.prediction.runner \
                  --fixtures artifacts/future_fixtures.csv \
                  --output artifacts/predictions.csv \
                  --status artifacts/prediction_status.json \
                  --model-policy production
                ;;
              *)
                echo "Unsupported prediction_mode=$PREDICTION_MODE" >&2
                exit 1
                ;;
            esac
          else
            printf '%s\n' '{"status":"DEFERRED_NO_ADOPTED_PRODUCTION_MODEL","reason":"No complete adopted production model bundle is present; validated candidates remain research-only."}' > artifacts/prediction_status.json
            echo "No adopted production model present; prediction execution deferred."
          fi
      - name: Generate outcome-free uncertainty shadow telemetry
        if: success()
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -s models/current/production_model.pkl ] && [ -s artifacts/future_fixtures.csv ] && [ -s artifacts/predictions.csv ]; then
            python -m src.research.forecast_diagnostics \
              --fixtures artifacts/future_fixtures.csv \
              --bundle models/current/production_model.pkl \
              --output artifacts/forecast_uncertainty_shadow.csv \
              --status artifacts/forecast_uncertainty_shadow_status.json
            python - <<'PY'
          import numpy as np
          import pandas as pd
          from pathlib import Path
          shadow = pd.read_csv("artifacts/forecast_uncertainty_shadow.csv")
          pred = pd.read_csv("artifacts/predictions.csv")
          if shadow["match_id"].astype(str).duplicated().any():
              raise SystemExit("uncertainty shadow contains duplicate match_id")
          pred_ids = pred["match_id"].astype(str)
          shadow_ids = shadow["match_id"].astype(str)
          if not set(pred_ids).issubset(set(shadow_ids)):
              raise SystemExit("uncertainty shadow does not cover every prediction")
          merged = shadow.merge(
              pred[["match_id","p_home","p_draw","p_away"]],
              on="match_id", how="inner", validate="one_to_one"
          )
          if len(merged) != len(pred):
              raise SystemExit("uncertainty shadow/prediction coverage mismatch")
          if not np.allclose(
              merged[["p_home_x","p_draw_x","p_away_x"]].to_numpy(float),
              merged[["p_home_y","p_draw_y","p_away_y"]].to_numpy(float),
              atol=1e-12,
          ):
              raise SystemExit("uncertainty shadow probabilities differ from production predictions")
          print({"status":"SHADOW_TELEMETRY_MATCHED","rows":len(shadow)})
          PY
          else
            printf '%s\n' '{"status":"SHADOW_TELEMETRY_SKIPPED","rows":0,"outcome_free":true,"production_prediction_unchanged":true}' > artifacts/forecast_uncertainty_shadow_status.json
            echo "No adopted production prediction artifact available; shadow telemetry skipped."
          fi

      - name: Upload matchday intelligence artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-matchday-intelligence-${{ github.run_id }}
          path: |
            artifacts/future_matchday_fixtures.csv
            artifacts/matchday_intelligence_status.json
            artifacts/future_fixtures.csv
            artifacts/predictions.csv
            artifacts/prediction_status.json
            artifacts/forecast_uncertainty_shadow.csv
            artifacts/forecast_uncertainty_shadow_status.json
          retention-days: 2
