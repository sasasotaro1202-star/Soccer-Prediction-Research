name: Soccer MOM Proxy Research

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/mom_proxy.py"
      - "tests/test_mom_proxy.py"
      - ".github/workflows/soccer-mom-proxy.yml"
  schedule:
    - cron: "15 4 * * 0"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Research start year"
        required: false
        default: "2012"
      end_year:
        description: "Research end year"
        required: false
        default: "2025"

permissions:
  contents: read

concurrency:
  group: soccer-mom-proxy
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 pyarrow

      - name: Compile project
        run: python -m compileall -q src tests

      - name: Run MOM proxy unit tests
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q tests/test_mom_proxy.py

      - name: Execute MOM proxy chronological OOS research
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: .
          START_YEAR: ${{ inputs.start_year || '2012' }}
          END_YEAR: ${{ inputs.end_year || '2025' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from src.research.mom_proxy import save_mom_proxy_artifacts

          start_year = int(os.environ["START_YEAR"])
          end_year = int(os.environ["END_YEAR"])
          if start_year > end_year:
              raise SystemExit("start_year must be <= end_year")
          state = save_mom_proxy_artifacts(
              start_year=start_year,
              end_year=end_year,
              output_dir="artifacts/mom_proxy",
              cache_dir="cache/mom_proxy",
          )
          print({
              "status": state.get("status"),
              "case_rows": state.get("case_rows"),
              "oos_blocks": state.get("oos_blocks"),
              "development": state.get("development"),
              "locked": state.get("locked"),
              "gates": state.get("gates"),
              "production_usable": state.get("production_usable"),
              "proxy_label": state.get("proxy_label"),
          })
          if state.get("production_usable") is not False:
              raise SystemExit("MOM proxy research must remain production_usable=false")
          PY

      - name: Publish MOM proxy research summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## MOM proxy research"
            if [ -s artifacts/mom_proxy/mom_proxy_status.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("artifacts/mom_proxy/mom_proxy_status.json").read_text(encoding="utf-8"))
          print(f"- Proxy label={s.get('proxy_label')}")
          print(f"- Cases={s.get('case_rows', 0)}, OOS blocks={s.get('oos_blocks', 0)}")
          print(f"- Production usable={s.get('production_usable')}")
          dev = s.get("development") or {}
          lock = s.get("locked") or {}
          print(f"- Development Top-4={dev.get('top4_hit_rate')} vs baseline={dev.get('baseline_top4_hit_rate')}")
          print(f"- Development LogLoss={dev.get('logloss')} vs baseline={dev.get('baseline_logloss')}")
          print(f"- Locked Top-4={lock.get('top4_hit_rate')} vs baseline={lock.get('baseline_top4_hit_rate')}")
          print(f"- Locked LogLoss={lock.get('logloss')} vs baseline={lock.get('baseline_logloss')}")
          print(f"- Gates={s.get('gates')}")
          for row in (s.get("competition_metrics") or []):
              print(
                  f"- **{row.get('competition')} / {row.get('model')}**: "
                  f"n={row.get('fixtures')}, Top-1={row.get('top1_hit_rate')}, "
                  f"Top-4={row.get('top4_hit_rate')}, MRR={row.get('mrr')}, "
                  f"LogLoss={row.get('logloss')}, CandidateRecall={row.get('candidate_recall')}"
              )
          PY
            else
              echo "- MOM proxy research status artifact unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MOM proxy research artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-mom-proxy-research-${{ github.run_id }}
          path: artifacts/mom_proxy/
          retention-days: 14
          if-no-files-found: warn
