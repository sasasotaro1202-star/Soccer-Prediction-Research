name: Soccer Official POTM Label Adapter

on:
  pull_request:
    branches: [main]
    paths:
      - "src/research/sofascore_official_potm.py"
      - "tests/test_sofascore_official_potm.py"
      - ".github/workflows/soccer-official-potm.yml"
  schedule:
    - cron: "35 4 * * 0"
  workflow_dispatch:
    inputs:
      events_path:
        description: "CSV containing a unique sofascore_event_id column; leave empty for tests only"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: soccer-official-potm
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt

      - name: Compile project
        run: python -m compileall -q src tests

      - name: Run official POTM adapter tests
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q tests/test_sofascore_official_potm.py

      - name: Run optional label extraction
        if: ${{ inputs.events_path != '' }}
        env:
          PYTHONPATH: .
          EVENTS_PATH: ${{ inputs.events_path }}
        run: |
          set -euo pipefail
          test -s "$EVENTS_PATH"
          python - <<'PY'
          import os
          from src.research.sofascore_official_potm import save_labels
          state = save_labels(
              os.environ["EVENTS_PATH"],
              output_path="artifacts/sofascore_potm/official_potm_labels.csv",
          )
          print(state)
          if state.get("production_usable") is not False:
              raise SystemExit("official POTM adapter must remain research-only")
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-official-potm-${{ github.run_id }}
          path: artifacts/sofascore_potm/
          retention-days: 14
          if-no-files-found: warn
