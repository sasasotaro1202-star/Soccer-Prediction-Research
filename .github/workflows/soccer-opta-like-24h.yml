name: Soccer Opta-like 24H Research Marathon

on:
  workflow_dispatch:
  schedule:
    - cron: "05 0 * * *"

permissions:
  contents: read

concurrency:
  group: soccer-opta-like-24h
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONHASHSEED: '0'

jobs:
  phase1:
    name: Phase 1 - discovery and source probe
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.research.opta_like_source_probe --output artifacts/opta_like_source_probe.json
      - run: python -m src.research.scope_frontier --days 14 --output artifacts/scope_frontier.json
      - run: python -m src.research.coverage_funnel_audit --frontier artifacts/scope_frontier.json --output artifacts/coverage_funnel.json

      - name: Write immutable run manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/checkpoints
          python - <<'PY'
          import json
          from pathlib import Path
          payload={
              'schema_version':1,
              'research_only':True,
              'production_changed':False,
              'github_sha':'${{ github.sha }}',
              'run_id':int('${{ github.run_id }}'),
              'source':'soccer-opta-like-24h',
          }
          Path('artifacts/checkpoints/run_manifest.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
      - name: Record phase 1 checkpoint
        if: always()
        env:
          PHASE_STATUS: ${{ job.status }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/checkpoints
          python -m src.research.checkpoint_state record \
            --store artifacts/checkpoints/research_checkpoints.jsonl \
            --experiment-key "24h/phase1/source-discovery" \
            --status "${PHASE_STATUS}" \
            --git-sha "${GIT_SHA}" \
            --run-id "${RUN_ID}" \
            --config-json '{"phase":1,"purpose":"source_discovery_and_probe"}' \
            --artifacts-json '["artifacts/opta_like_source_probe.json","artifacts/scope_frontier.json"]'

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-opta-24h-phase1-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  phase2:
    name: Phase 2 - data and PIT
    needs: phase1
    if: needs.phase1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 pyarrow
      - name: Global Data Lake research
        run: |
          set -euo pipefail
          python - <<'PY'
          from src.data.global_datalake_adapter import save_research_artifacts
          x = save_research_artifacts(start_year=2012, end_year=2025, output_dir='artifacts/global_datalake', cache_dir='cache/global_datalake')
          print(x)
          if x.get('status') != 'OK': raise SystemExit('GFDL research failed')
          PY
      - name: Structural and strict PIT diagnostics
        run: |
          set -euo pipefail
          python -m src.data.fixture_field_audit
          PIT_ENABLE_ARCHIVE_AUDIT=1 python -m src.data.completion_gate
          test -s artifacts/completion_gate.json
      - name: Representative PIT replay
        run: |
          set -euo pipefail
          mkdir -p artifacts/pit_samples
          for c in EPL UCL UEL UECL J1; do
            python -m src.research.pit_replay_audit --competition "$c" --rows-per-season 2 || echo "$c: BLOCKED_OR_FAILED" > "artifacts/pit_samples/$c.status"
          done
      - name: Record phase 2 checkpoint
        if: always()
        env:
          PHASE_STATUS: ${{ job.status }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/checkpoints
          python -m src.research.checkpoint_state record \
            --store artifacts/checkpoints/research_checkpoints.jsonl \
            --experiment-key "24h/phase2/pit-data" \
            --status "${PHASE_STATUS}" \
            --git-sha "${GIT_SHA}" \
            --run-id "${RUN_ID}" \
            --config-json '{"phase":2,"purpose":"data_and_pit_validation","archive_audit":"1"}' \
            --artifacts-json '["artifacts/completion_gate.json","artifacts/pit_replay_features.csv"]'

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-opta-24h-phase2-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  phase3:
    name: Phase 3 - OOS/control
    needs: phase2
    if: needs.phase2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 8 --timeout 90 pyarrow
      - name: Build fresh PIT handoff
        run: |
          set -euo pipefail
          PIT_ENABLE_ARCHIVE_AUDIT=1 python -m src.data.completion_gate
          test -s artifacts/pit_replay_features.csv
      - name: Run v13 chronological OOS controller
        run: |
          set -euo pipefail
          python -m src.research.innovative_control_v13 --features artifacts/pit_replay_features.csv --out artifacts/innovative_control_v13
      - name: Re-run deterministic suite
        run: python -m pytest -q
      - name: Validate cross-project research contracts
        run: python -m pytest -q tests/test_case_risk_oos.py tests/test_checkpoint_state.py tests/test_dual_memory_oos.py tests/test_source_snapshot.py
      - name: Record phase 3 checkpoint
        if: always()
        env:
          PHASE_STATUS: ${{ job.status }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/checkpoints
          python -m src.research.checkpoint_state record \
            --store artifacts/checkpoints/research_checkpoints.jsonl \
            --experiment-key "24h/phase3/oos-control" \
            --status "${PHASE_STATUS}" \
            --git-sha "${GIT_SHA}" \
            --run-id "${RUN_ID}" \
            --config-json '{"phase":3,"purpose":"oos_control_case_risk"}' \
            --artifacts-json '["artifacts/pit_replay_features.csv","artifacts/innovative_control_v13/experiment_results.json"]'

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-opta-24h-phase3-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  phase4:
    name: Phase 4 - verification and handoff
    needs: phase3
    if: needs.phase3.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
      - run: python -m pytest -q
      - name: Download Phase 3 research evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632e53
        with:
          name: soccer-opta-24h-phase3-${{ github.run_id }}
          path: artifacts/phase3

      - name: Production immutability check
        run: |
          set -euo pipefail
          test -f artifacts/phase3/innovative_control_v13/experiment_results.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/phase3/innovative_control_v13/experiment_results.json')
          x=json.loads(p.read_text())
          if x.get('production_changed') is True: raise SystemExit('production_changed=true')
          print({'status':x.get('status'),'oos_claimed':x.get('oos_claimed'),'production_changed':x.get('production_changed')})
          PY
      - name: Write final checkpoint
        run: |
          mkdir -p artifacts/24h
          printf '%s\n' '{"production_changed":false,"commit":"${{ github.sha }}","run_id":"${{ github.run_id }}"}' > artifacts/24h/final_checkpoint.json
      - name: Record phase 4 checkpoint
        if: always()
        env:
          PHASE_STATUS: ${{ job.status }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/checkpoints
          python -m src.research.checkpoint_state record \
            --store artifacts/checkpoints/research_checkpoints.jsonl \
            --experiment-key "24h/phase4/verification" \
            --status "${PHASE_STATUS}" \
            --git-sha "${GIT_SHA}" \
            --run-id "${RUN_ID}" \
            --config-json '{"phase":4,"purpose":"evidence_and_production_immutability"}' \
            --artifacts-json '["artifacts/phase3/innovative_control_v13/experiment_results.json","artifacts/24h/final_checkpoint.json"]'

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-opta-like-24h-final-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  finalize:
    name: Final - 24H evidence reconciliation
    needs: [phase1, phase2, phase3, phase4]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Download available phase evidence
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632e53
        with:
          pattern: soccer-opta-24h-phase*
          merge-multiple: true
          path: artifacts/phases
      - name: Reconcile immutable handoff
        env:
          P1: ${{ needs.phase1.result }}
          P2: ${{ needs.phase2.result }}
          P3: ${{ needs.phase3.result }}
          P4: ${{ needs.phase4.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/final
          python - <<'PY'
          import json, os
          from pathlib import Path
          phases={
              "phase1_discovery":os.environ["P1"],
              "phase2_pit_data":os.environ["P2"],
              "phase3_oos":os.environ["P3"],
              "phase4_verify":os.environ["P4"],
          }
          status="COMPLETED" if all(v=="success" for v in phases.values()) else "PARTIAL_OR_BLOCKED"
          payload={
              "schema_version":1,
              "status":status,
              "commit":"${{ github.sha }}",
              "run_id":int("${{ github.run_id }}"),
              "phase_results":phases,
              "production_changed":False,
              "research_only":True,
              "oos_claimed": phases["phase3_oos"]=="success",
          }
          Path("artifacts/final/24h_run_status.json").write_text(json.dumps(payload,indent=2),encoding="utf-8")
          print(json.dumps(payload,indent=2))
          PY
      - name: Verify no research phase claims production mutation
        shell: bash
        run: |
          set -euo pipefail
          if find artifacts/phases -name '*.json' -print0 | xargs -0 grep -l '"production_changed": true' 2>/dev/null; then
            echo "Detected production mutation claim in research evidence" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: soccer-opta-like-24h-reconciled-${{ github.run_id }}
          path: artifacts/final/
          retention-days: 14
          if-no-files-found: error

# Maximum runtime: 4 x 360 minutes = 24 hours.
# The workflow is research-only. It does not promote models or change production.
# GitHub Actions schedule becomes active once this workflow is present on the default branch.