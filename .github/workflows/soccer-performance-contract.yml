name: Soccer Performance Contract

on:
  push:
    paths:
      - "src/research/performance_snapshot.py"
      - "tests/test_performance_snapshot.py"
      - ".github/workflows/soccer-performance-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Run performance snapshot contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_performance_snapshot.py
