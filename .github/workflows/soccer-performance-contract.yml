name: Soccer Performance Contract

on:
  push:
    paths:
      - "src/research/performance_snapshot.py"
      - "tests/test_performance_snapshot.py"
      - "src/research/target_oos.py"
      - "tests/test_target_oos.py"
      - "src/research/engine.py"
      - ".github/workflows/soccer-performance-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: soccer-performance-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 120 -r requirements.txt
      - name: Run performance evidence contract tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_performance_snapshot.py             tests/test_target_oos.py
