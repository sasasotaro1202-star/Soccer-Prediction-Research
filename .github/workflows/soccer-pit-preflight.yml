name: Soccer PIT Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: soccer-pit-preflight
  cancel-in-progress: false

jobs:
  pit-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/raw
          key: soccer-pit-raw-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/data/**/*.py', 'src/data/*.py') }}
          restore-keys: soccer-pit-raw-${{ runner.os }}-
      - name: Cache PIT archive evidence
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/raw/pit_evidence
          key: soccer-pit-evidence-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/data/pit_source_adapter_fast.py', 'src/data/pit_source_adapter_v2.py', 'src/data/pit_archive_fallback.py') }}
          restore-keys: soccer-pit-evidence-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt
      - name: Compile
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m compileall -q src tests
      - name: Run fixture/source audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.fixture_field_audit
      - name: Run auxiliary audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.auxiliary_audit
      - name: Run strict PIT completion gate
        id: pit_gate
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          PYTHONWARNINGS: "default"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
        run: python -m src.data.completion_gate
      - name: Print PIT bottleneck summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/completion_gate.json")
          if not p.exists():
              print("completion_gate.json not found")
              raise SystemExit(0)
          x = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "pit_publication_time_gate": x.get("pit_publication_time_gate"),
              "pit_replay_verified_rows": x.get("pit_replay_verified_rows"),
              "pit_replay_verified_rate": x.get("pit_replay_verified_rate"),
              "pit_replay_verified_competitions": x.get("pit_replay_verified_competitions"),
              "pit_preflight_error": x.get("pit_preflight_error"),
              "blocking_reasons": x.get("blocking_reasons", []),
              "pit_competition_breakdown": x.get("pit_competition_breakdown", {}),
          }, indent=2, ensure_ascii=False))
          PY
      - name: Upload PIT evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-pit-preflight-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
