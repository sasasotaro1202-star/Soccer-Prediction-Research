name: Soccer Predictability Research

on:
  push:
    branches: [main]
    paths:
      - "src/research/predictability_map.py"
      - "src/research/temporal_conformal_sets.py"
      - "src/research/predictability_calibration.py"
      - "src/research/pit_training.py"
      - "src/research/future_model_failure_oos.py"
      - "tests/test_pit_training.py"
      - "tests/test_predictability_map.py"
      - "tests/test_temporal_conformal_sets.py"
      - "tests/test_predictability_calibration.py"
      - "tests/test_predictability_calibration_pit_provenance.py"
      - "tests/test_future_model_failure_oos.py"
      - "tests/test_pit_training.py"
      - ".github/workflows/soccer-predictability-research.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 */6 * * *"

permissions:
  contents: write

concurrency:
  group: soccer-predictability-research
  # Never cancel a manual research run because a scheduled refresh arrives.
  # Safe serialization is preferable to silently discarding requested work.
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONHASHSEED: "0"

jobs:
  predictability:
    name: Predictability map -> chronological failure-risk challenger
    runs-on: ubuntu-latest
    # Manual runs use the full hosted-runner job budget; scheduled/push runs
    # retain the existing 45-minute operational bound.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 45 }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..."
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Compile project
        run: python -m compileall -q src tests

      - name: Run predictability, calibration and conformal regression tests
        run: python -m pytest -q tests/test_predictability_map.py tests/test_predictability_calibration.py tests/test_predictability_calibration_pit_provenance.py tests/test_temporal_conformal_sets.py tests/test_future_model_failure_oos.py tests/test_pit_training.py

      - name: Build chronological predictability calibration artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/predictability_calibration
          if [ -s data/experience/prediction_ledger.csv ]; then
            python -m src.research.predictability_calibration
          else
            python - <<'PY'
          import json
          from pathlib import Path
          out = Path("artifacts/predictability_calibration")
          import pandas as pd
          pd.DataFrame().to_csv(out / "predictability_calibration_oos.csv", index=False)
          pd.DataFrame().to_csv(out / "predictability_calibration_cases.csv", index=False)
          state = {
              "schema_version": 1,
              "status": "WARMUP",
              "rows": 0,
              "production_usable": False,
              "oos_blocks": [],
              "gate": {"status": "HOLD", "blocks": 0},
              "safety_contract": {
                  "research_only": True,
                  "production_changed": False,
                  "production_probabilities_changed": False,
                  "frozen_holdout_touched": False,
                  "outcome_data_used_only_after_maturity": True,
                  "calibration_training_is_prior_history_only": True,
                  "locked_suffix_outcomes_never_train_calibrator": True,
              },
          }
          (out / "predictability_calibration_status.json").write_text(
              json.dumps(state, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          fi
          test -s artifacts/predictability_calibration/predictability_calibration_status.json

      - name: Build maturity-gated conformal research artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/conformal
          if [ -s data/experience/prediction_ledger.csv ]; then
            python -m src.research.temporal_conformal_sets
          else
            python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path("artifacts/conformal")
          pd.DataFrame().to_csv(out / "prediction_sets.csv", index=False)
          state = {
              "schema_version": 1,
              "status": "WARMUP",
              "rows": 0,
              "eligible_rows": 0,
              "production_usable": False,
              "metrics": {
                  "total_rows": 0,
                  "eligible_rows": 0,
                  "coverage": None,
                  "mean_set_size": None,
                  "singleton_rate": None,
                  "singleton_accuracy": None,
                  "abstain_rate": None,
              },
              "safety_contract": {
                  "research_only": True,
                  "production_changed": False,
                  "production_probabilities_changed": False,
                  "outcome_data_used_only_after_maturity": True,
                  "frozen_holdout_touched": False,
                  "same_prediction_time_excluded": True,
              },
          }
          (out / "conformal_status.json").write_text(
              json.dumps(state, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          fi
          test -s artifacts/conformal/conformal_status.json
          test -s artifacts/conformal/prediction_sets.csv

      - name: Build PIT-safe predictability research artifacts
        run: |
          set -euo pipefail
          if [ -s data/experience/prediction_ledger.csv ]; then
            python -m src.research.predictability_map
          else
            mkdir -p artifacts/predictability
            python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path("artifacts/predictability")
          empty = pd.DataFrame()
          for name in (
              "predictability_map.csv",
              "predictability_oos.csv",
              "predictability_latest_cases.csv",
              "predictability_oos_cases.csv",
          ):
              empty.to_csv(out / name, index=False)
          state = {
              "schema_version": 1,
              "status": "WARMUP",
              "reason": "No matured prediction ledger is present; predictability research is fail-closed.",
              "production_usable": False,
              "input_digest": "EMPTY",
              "rows": 0,
              "predictability_scored_rows": 0,
              "high_confidence_low_predictability_rows": 0,
              "gate": {"status": "HOLD", "blocks": 0},
              "safety_contract": {
                  "research_only": True,
                  "production_changed": False,
                  "production_probabilities_changed": False,
                  "production_registry_changed": False,
                  "frozen_holdout_touched": False,
                  "outcome_data_used_only_after_maturity": True,
                  "prediction_time_features_only": True,
                  "chronological_oos_required_for_candidate": True,
              },
          }
          (out / "predictability_status.json").write_text(
              json.dumps(state, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          print(json.dumps(state, ensure_ascii=False))
          PY
          fi
          test -s artifacts/predictability/predictability_status.json
          test -s artifacts/predictability/predictability_map.csv
          test -s artifacts/predictability/predictability_oos.csv
          test -s artifacts/predictability/predictability_latest_cases.csv
          test -s artifacts/predictability/predictability_oos_cases.csv

      - name: Fail closed on research safety contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          artifacts = {
              "predictability": Path("artifacts/predictability/predictability_status.json"),
              "calibration": Path("artifacts/predictability_calibration/predictability_calibration_status.json"),
              "conformal": Path("artifacts/conformal/conformal_status.json"),
          }
          failed = []
          for name, path in artifacts.items():
              if not path.is_file() or path.stat().st_size <= 0:
                  failed.append(f"{name}:missing_status")
                  continue
              state = json.loads(path.read_text(encoding="utf-8"))
              safety = state.get("safety_contract") or {}
              required = {
                  "production_usable": state.get("production_usable") is False,
                  "research_only": safety.get("research_only") is True,
                  "production_changed": safety.get("production_changed") is False,
                  "production_probabilities_changed": safety.get("production_probabilities_changed") is False,
                  "frozen_holdout_touched": safety.get("frozen_holdout_touched") is False,
                  "outcome_data_used_only_after_maturity": safety.get("outcome_data_used_only_after_maturity") is True,
              }
              if name == "predictability":
                  required["production_registry_changed"] = safety.get("production_registry_changed") is False
                  required["prediction_time_features_only"] = safety.get("prediction_time_features_only") is True
                  required["chronological_oos_required_for_candidate"] = safety.get("chronological_oos_required_for_candidate") is True
              elif name == "calibration":
                  required["prior_history_only"] = safety.get("calibration_training_is_prior_history_only") is True
                  required["locked_suffix_not_trained"] = safety.get("locked_suffix_outcomes_never_train_calibrator") is True
              elif name == "conformal":
                  required["same_prediction_time_excluded"] = safety.get("same_prediction_time_excluded") is True
              for check, ok in required.items():
                  if not ok:
                      failed.append(f"{name}:{check}")
          if failed:
              raise SystemExit("RESEARCH SAFETY GATE FAILED: " + ", ".join(failed))
          print("predictability_calibration_conformal_safety: PASS")
          PY

      - name: Publish research summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Predictability research"
            if [ -s artifacts/predictability/predictability_status.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(
              Path("artifacts/predictability/predictability_status.json")
              .read_text(encoding="utf-8")
          )
          gate = s.get("gate") or {}
          print(f"- Status={s.get('status')}")
          print(f"- Matured case rows={s.get('rows', 0)}")
          print(f"- Predictability-scored rows={s.get('predictability_scored_rows', 0)}")
          print(f"- High-confidence/low-predictability cases={s.get('high_confidence_low_predictability_rows', 0)}")
          print(f"- Chronological OOS blocks={gate.get('blocks', 0)}")
          print(f"- Gate={gate.get('status', 'HOLD')}")
          print("- Production usable=False")
          PY
            else
              echo "- Predictability status artifact unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit durable predictability research artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-predictability-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            artifacts/predictability/predictability_status.json \
            artifacts/predictability/predictability_map.csv \
            artifacts/predictability/predictability_oos.csv \
            artifacts/predictability/predictability_latest_cases.csv \
            artifacts/predictability/predictability_oos_cases.csv \
            artifacts/predictability_calibration/predictability_calibration_status.json \
            artifacts/predictability_calibration/predictability_calibration_oos.csv \
            artifacts/predictability_calibration/predictability_calibration_cases.csv \
            artifacts/conformal/conformal_status.json \
            artifacts/conformal/prediction_sets.csv
          do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No predictability research changes to commit."
            exit 0
          fi
          git commit -m "ops: persist predictability calibration and conformal research state"
          for attempt in 1 2 3; do
            git fetch --prune origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "predictability artifact push attempt ${attempt} failed; rebasing again..."
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done