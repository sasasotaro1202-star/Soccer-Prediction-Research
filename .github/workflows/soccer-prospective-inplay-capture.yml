name: Soccer Prospective In-Play PIT Capture

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-prospective-inplay-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture prospective live-state snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main

      - name: Capture three spaced observations
        run: |
          set -euo pipefail
          python -m src.research.prospective_inplay capture \
            --output-root data/research/prospective_inplay/raw \
            --loops 3 \
            --interval-seconds 240 | tee /tmp/capture-report.json

      - name: Persist prospective raw snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-prospective-capture-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/prospective_inplay/raw/
          if git diff --cached --quiet; then
            echo "No new prospective in-play snapshots."
            exit 0
          fi
          git commit -m "data: persist prospective in-play PIT snapshots"
          for attempt in 1 2 3; do
            git fetch --prune origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "snapshot push attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Upload capture report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-prospective-inplay-capture
          path: /tmp/capture-report.json
          if-no-files-found: warn
          retention-days: 7
