name: Soccer Prospective In-Play Maturity

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/research/prospective_inplay/raw/**"
      - "src/research/prospective_inplay.py"
      - "src/research/match_state_hazard.py"
      - "tests/test_prospective_inplay.py"
      - "tests/test_match_state_hazard.py"
      - ".github/workflows/soccer-prospective-inplay-maturity.yml"

permissions:
  contents: write

concurrency:
  group: soccer-prospective-inplay-maturity
  cancel-in-progress: false

jobs:
  mature-and-research:
    name: Mature PIT snapshots and advance research
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
      MATCH_STATE_INPUT: data/research/match_state_snapshots
      MATCH_STATE_OUT: artifacts/match_state_research
    steps:
      - name: Checkout current main or exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..."
            if [ "${attempt}" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Compile research modules
        run: python -m compileall -q src/research/prospective_inplay.py src/research/match_state_hazard.py

      - name: Run capture regression tests
        run: python -m pytest -q tests/test_prospective_inplay.py

      - name: Build matured monthly partitions
        run: |
          set -euo pipefail
          python -m src.research.prospective_inplay mature \
            --raw-root data/research/prospective_inplay/raw \
            --output-root data/research/match_state_snapshots | tee /tmp/maturity-report.json

      - name: Detect newly matured evidence
        id: maturity
        run: |
          set -euo pipefail
          new_rows="$(python - <<'PY'
          import json
          r = json.load(open("/tmp/maturity-report.json", encoding="utf-8"))
          print(sum(int(x.get("new_rows", 0)) for x in r.get("written", [])))
          PY
          )"
          echo "new_rows=$new_rows"
          echo "new_rows=$new_rows" >> "$GITHUB_OUTPUT"

      - name: Run staged match-state research on new evidence
        if: steps.maturity.outputs.new_rows != '0' || github.event_name != 'schedule'
        run: |
          set -euo pipefail
          python -m src.research.match_state_hazard \
            --input "$MATCH_STATE_INPUT" \
            --out "$MATCH_STATE_OUT"

      - name: Reuse latest research state when no new evidence
        if: steps.maturity.outputs.new_rows == '0' && github.event_name == 'schedule'
        run: |
          set -euo pipefail
          mkdir -p "$MATCH_STATE_OUT"
          if [ -s data/research/match_state_research_status.json ]; then
            cp data/research/match_state_research_status.json "$MATCH_STATE_OUT/match_state_status.json"
          else
            printf '%s\n' '{"schema_version":2,"status":"WARMUP","oos_claimed":false,"performance_verified":false,"promotion_candidate":false,"production_usable":false,"research_only":true,"pit_status":"NOT_EXECUTED"}' > "$MATCH_STATE_OUT/match_state_status.json"
          fi

      - name: Enforce research-only state machine
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/match_state_research/match_state_status.json")
          if not p.is_file():
              raise SystemExit("missing match-state status")
          s = json.loads(p.read_text(encoding="utf-8"))
          allowed = {"WARMUP", "SCHEMA_VERIFIED", "OOS_EVALUATED", "CALIBRATION_ROBUSTNESS_EVALUATED"}
          if s.get("status") not in allowed:
              raise SystemExit(f"unexpected research state: {s.get('status')}")
          if s.get("research_only") is not True:
              raise SystemExit("research_only must remain true")
          for key in ("production_usable", "performance_verified", "promotion_candidate"):
              if s.get(key) is not False:
                  raise SystemExit(f"{key} must remain false")
          if s.get("pit_status") not in {"PASS", "NOT_EXECUTED"}:
              raise SystemExit("invalid PIT status")
          print("staged_research_state: PASS")
          PY

      - name: Persist matured data and latest research state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/match_state_research/match_state_status.json data/research/match_state_research_status.json
          git config user.name "soccer-world-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/match_state_snapshots/ data/research/match_state_research_status.json
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "PR validation only; main persistence disabled."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "No matured research state changes."
            exit 0
          fi
          git commit -m "data: persist matured in-play research state"
          for attempt in 1 2 3; do
            git fetch --prune origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "maturity push attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Upload maturity and research evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-prospective-inplay-maturity
          path: |
            /tmp/maturity-report.json
            artifacts/match_state_research/
          if-no-files-found: warn
          retention-days: 14
