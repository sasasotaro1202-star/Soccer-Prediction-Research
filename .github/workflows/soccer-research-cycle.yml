name: Soccer Research Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      PYTHONPATH: .
      # Archive replay is a sampled reproducibility audit. It is independent of
      # the deterministic feature-PIT gate and never blocks legal result features
      # merely because a historical archive provider cannot replay a page today.
      PIT_REPLAY_ROWS_PER_GROUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('src/data/football_data.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run research engine
        run: python -m src.research.engine
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-research-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - name: Commit research artifacts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ || true
          git diff --cached --quiet || git commit -m "Update soccer research artifacts"
          git push || true
