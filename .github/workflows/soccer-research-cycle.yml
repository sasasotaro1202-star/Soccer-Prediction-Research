name: Soccer Research Cycle

# Legacy compatibility lane.
# Routine autonomous research is owned by the state-based control plane.
# Keeping this workflow manual-only prevents duplicate weekly research
# executions while preserving an explicit recovery/debug entry point.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-research-cycle-manual
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONHASHSEED: "0"
  PIT_ENABLE_ARCHIVE_AUDIT: "1"
  PIT_ENABLE_SECONDARY_ARCHIVE: "1"
  PIT_REPLAY_ROWS_PER_GROUP: "1"
  RESEARCH_ATTEMPTS: "2"
  RESEARCH_RETRY_BACKOFF: "10"

jobs:
  research:
    name: Manual safe research compatibility run
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 300 -r requirements.txt; then
              exit 0
            fi
            echo "dependency install attempt ${attempt} failed" >&2
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Compile source and tests
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m compileall -q src tests

      - name: Run deterministic tests
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m pytest -q

      - name: Run structural audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.fixture_field_audit

      - name: Persist preflight audit status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("artifacts/audit_summary.json")
          if not summary_path.exists():
              raise SystemExit("audit_summary.json missing after fixture audit")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          passed = bool(summary.get("audit_execution_ok") is True)
          Path("artifacts/audit_status.json").write_text(
              json.dumps(
                  {"exit_code": 0 if passed else 1, "passed": passed},
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          if not passed:
              raise SystemExit("structural audit execution failed")
          PY

      - name: Run strict completion/PIT gate
        id: completion
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.completion_gate

      - name: Verify gate handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(Path("artifacts/completion_gate.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("artifacts/audit_gate.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "completion_full_gate_passed": gate.get("full_gate_passed"),
              "audit_full_gate_passed": audit.get("full_gate_passed"),
              "pit_publication_time_gate": gate.get("pit_publication_time_gate"),
              "blocking_reasons": gate.get("blocking_reasons") or [],
          }, ensure_ascii=False))
          if gate.get("full_gate_passed") is not True:
              raise SystemExit("completion gate did not pass; research must remain blocked")
          if audit.get("full_gate_passed") is not True:
              raise SystemExit("audit gate did not pass; research must remain blocked")
          PY

      - name: Run research through fail-closed runner
        id: safe_runner
        env:
          TESTS_PASSED: "true"
          AUDIT_PASSED: ${{ steps.handoff.outcome == 'success' }}
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.research.safe_runner

      - name: Publish research safety summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Soccer Research Cycle"
            echo "- Manual compatibility lane: true"
            echo "- Autonomous scheduled owner: Soccer Autonomous Orchestrator"
            if [ -s artifacts/run_status.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("artifacts/run_status.json").read_text(encoding="utf-8"))
          print(f"- Status={s.get('status')}")
          print(f"- OOS claimed={s.get('oos_claimed', False)}")
          print(f"- Production mutation claimed={s.get('production_changed', False)}")
          PY
            else
              echo "- run_status.json unavailable"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload diagnostic research artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789
        with:
          name: soccer-research-cycle-manual-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
