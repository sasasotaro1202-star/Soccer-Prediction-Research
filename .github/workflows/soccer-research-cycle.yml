name: Soccer Research Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      # Archive replay is a sampled reproducibility audit. It is independent of
      # the deterministic feature-PIT gate and never blocks legal result features
      # merely because a historical archive provider cannot replay a page today.
      PIT_REPLAY_ROWS_PER_GROUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('src/data/football_data.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run research engine
        run: python -m src.research.engine
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-research-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
      - name: Commit research artifacts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          git add artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "Update soccer research artifacts"
            git push
          else
            echo "No research artifact changes to commit."
          fi
