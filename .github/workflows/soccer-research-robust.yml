name: Soccer Research Robust

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: soccer-research-robust
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
      PYTHONPATH: .
      RESEARCH_ATTEMPTS: "2"
      RESEARCH_RETRY_BACKOFF: "10"
      PIT_ENABLE_ARCHIVE_AUDIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('src/data/football_data.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run research engine with bounded retries
        run: python -m src.research.safe_runner
      - name: Validate research artifact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/run_status.json')
          if not p.exists():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({'status':'DEGRADED','reason':'No run_status.json produced'}, indent=2), encoding='utf-8')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-research-robust-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - name: Commit research artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Update soccer research artifacts"
          fi
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort || true
            exit 0
          }
          git push
