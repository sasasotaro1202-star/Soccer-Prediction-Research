name: Soccer Research Robust

on:
  workflow_dispatch:
    inputs:
      run_prediction:
        description: "Explicitly enable production prediction for this manual run only"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: read

# Never cancel an in-flight research run merely because another push arrived.
# A long PIT/OOS run must finish against the exact commit it checked out.
concurrency:
  group: soccer-research-robust
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/data/**/*.py', 'src/data/*.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Cache PIT archive evidence
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: data/raw/pit_evidence
          key: soccer-pit-evidence-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/data/pit_source_adapter_fast.py', 'src/data/pit_source_adapter_v2.py', 'src/data/pit_archive_fallback.py') }}
          restore-keys: soccer-pit-evidence-${{ runner.os }}-
      - name: Install dependencies with bounded retry
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then
              exit 0
            fi
            echo "dependency installation attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Compile source and tests
        id: compile
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m compileall -q src tests
      - name: Run deterministic test suite
        id: tests
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p artifacts
          python -m pytest -q | tee artifacts/pytest_stdout.txt
      - name: Run fixture/source structural audit
        id: audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p artifacts
          python -m src.data.fixture_field_audit | tee artifacts/audit_stdout.json
      - name: Build audit gate artifact
        id: audit_gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/audit_summary.json')
          if not p.exists():
              raise SystemExit('audit_summary.json missing')
          s = json.loads(p.read_text(encoding='utf-8'))
          reasons=[]
          if not s.get('audit_execution_ok', False): reasons.append('audit_execution_ok=false')
          if int(s.get('duplicate_source_rows',0)) != 0: reasons.append('duplicate_source_rows!=0')
          if int(s.get('collision_rows',0)) != 0: reasons.append('collision_rows!=0')
          if int(s.get('team_mapping_invalid_rows',0)) != 0: reasons.append('team_mapping_invalid_rows!=0')
          if not s.get('coverage_scope_complete', False): reasons.append('coverage_scope_complete=false')
          payload={'full_gate_passed':not reasons,'blocking_reasons':reasons,'pit_publication_time_gate':bool(s.get('pit_publication_time_gate',False))}
          Path('artifacts/audit_gate.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False),encoding='utf-8')
          if reasons:
              raise SystemExit('AUDIT GATE FAILED: ' + '; '.join(reasons))
          PY
      - name: Run supplemental international/non-league audit
        id: auxiliary_audit
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: python -m src.data.auxiliary_audit | tee artifacts/auxiliary_audit_stdout.json
      - name: Run strict completion and PIT replay gate
        id: gate
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
        run: |
          mkdir -p artifacts
          python -m src.data.completion_gate | tee artifacts/completion_gate_stdout.json
          test -f artifacts/completion_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/completion_gate.json').read_text(encoding='utf-8'))
          if not x.get('full_gate_passed',False):
              raise SystemExit('COMPLETION/PIT GATE FAILED: ' + '; '.join(x.get('blocking_reasons',[])))
          PY
      - name: Run research engine with bounded retries
        id: research_engine
        env:
          TESTS_PASSED: "true"
          AUDIT_PASSED: "true"
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
          RESEARCH_ATTEMPTS: "2"
          RESEARCH_RETRY_BACKOFF: "10"
          PIT_ENABLE_ARCHIVE_AUDIT: "1"
        run: python -m src.research.safe_runner
      - name: Prepare future fixtures when supplied
        id: prepare_future
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p artifacts
          if [ ! -f data/future_fixtures.csv ]; then
            printf '{"status":"NO_FUTURE_FIXTURE_INPUT","prediction_enabled":false,"reason":"data/future_fixtures.csv is not present; no fixture is guessed or synthesized"}\n' > artifacts/future_fixture_status.json
            exit 0
          fi
          python -m src.prediction.prepare_fixtures --fixtures data/future_fixtures.csv --output artifacts/future_fixtures.csv | tee artifacts/future_fixture_prepare_stdout.json
      - name: Run production prediction only after explicit manual request
        id: prediction
        if: github.event_name == 'workflow_dispatch' && inputs.run_prediction == true
        env:
          PYTHONPATH: .
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/future_fixtures.csv ]; then
            printf '{"status":"NO_FIXTURE_INPUT","oos_claimed":false,"reason":"Explicit prediction was requested, but no prepared future fixtures exist"}\n' > artifacts/prediction_status.json
            exit 0
          fi
          python -m src.prediction.runner --fixtures artifacts/future_fixtures.csv --bundle artifacts/production_model.pkl --output artifacts/predictions.csv --status artifacts/prediction_status.json

      - name: Record prediction deferral when not explicitly requested
        if: github.event_name != 'workflow_dispatch' || inputs.run_prediction != true
        run: |
          mkdir -p artifacts
          printf '{"status":"PREDICTION_DEFERRED","prediction_enabled":false,"reason":"No explicit user prediction request was supplied"}\n' > artifacts/prediction_status.json
      - name: Evaluate production contract
        id: production_contract
        env:
          PYTHONPATH: .
        run: python -m src.research.production_contract
      - name: Build final health record
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts/run_status.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'DEGRADED','oos_claimed':False}
          data['workflow_health']={'run_id':os.environ.get('GITHUB_RUN_ID'),'head_sha':os.environ.get('GITHUB_SHA')}
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False,default=str),encoding='utf-8')
          PY
      - name: Upload research artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: soccer-research-robust-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
