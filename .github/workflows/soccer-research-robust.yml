name: Soccer Research Robust

on:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: soccer-research-robust
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Setup Python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache raw soccer data
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: data/raw
          key: soccer-raw-${{ runner.os }}-${{ hashFiles('src/data/football_data.py') }}
          restore-keys: soccer-raw-${{ runner.os }}-
      - name: Install dependencies
        continue-on-error: true
        run: python -m pip install -r requirements.txt
      - name: Run 14-competition fixture field PIT audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          set +e
          python -m src.data.fixture_field_audit > artifacts/audit_stdout.json
          rc=$?
          printf '{"exit_code":%s,"passed":%s}\n' "$rc" "$([ "$rc" -eq 0 ] && echo true || echo false)" > artifacts/audit_status.json
          exit "$rc"
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set +e
          python -m pytest -q
          rc=$?
          printf '{"exit_code":%s,"passed":%s}\n' "$rc" "$([ "$rc" -eq 0 ] && echo true || echo false)" > artifacts/test_status.json
          exit "$rc"
      - name: Run research engine with bounded retries
        if: always()
        env:
          TESTS_PASSED: ${{ steps.tests.outcome == 'success' && 'true' || 'false' }}
          AUDIT_PASSED: ${{ steps.audit.outcome == 'success' && 'true' || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: gpt-5.6-luna
          PYTHONPATH: .
          RESEARCH_ATTEMPTS: "2"
          RESEARCH_RETRY_BACKOFF: "10"
          PIT_ENABLE_ARCHIVE_AUDIT: "0"
        continue-on-error: true
        run: python -m src.research.safe_runner
      - name: Validate research artifact
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/run_status.json')
          if not p.exists():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({'status':'DEGRADED','reason':'No run_status.json produced','oos_claimed':False}, indent=2), encoding='utf-8')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY
      - name: Upload research artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: soccer-research-robust-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit research artifacts
        if: always()
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update soccer research artifacts [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if [ $? -ne 0 ]; then
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            git push origin HEAD:main
            if [ $? -eq 0 ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 0
      - name: Final health record
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/run_status.json ]; then
            printf '%s\n' '{"status":"DEGRADED","oos_claimed":false,"reason":"Workflow completed without a research status artifact"}' > artifacts/run_status.json
          fi
          echo "Soccer Research Robust finished; see artifacts/run_status.json for authoritative research status."
