name: Soccer Rich Data Availability

on:
  pull_request:
    branches: [main]
    paths:
      - "src/data/matchday_intelligence_fetch.py"
      - "src/data/matchday_rich_enrichment.py"
      - "src/data/external_fetch.py"
      - ".github/workflows/soccer-rich-data-availability.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: soccer-rich-data-availability
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Collect real future fixtures
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python -m src.data.matchday_intelligence_fetch             --days 2             --horizon-hours 48             --output artifacts/live_smoke_fixtures.csv             --status artifacts/live_smoke_fixture_status.json

      - name: Run real rich-data acquisition smoke test
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python -m src.data.matchday_rich_enrichment             --fixtures artifacts/live_smoke_fixtures.csv             --output artifacts/live_smoke_rich.csv             --raw-output artifacts/live_smoke_rich_raw.jsonl             --status artifacts/live_smoke_rich_status.json             --max-matches 3             --workers 3

      - name: Validate and publish actual availability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          fixture_status = json.loads(Path("artifacts/live_smoke_fixture_status.json").read_text(encoding="utf-8"))
          rich_status = json.loads(Path("artifacts/live_smoke_rich_status.json").read_text(encoding="utf-8"))
          fixtures = pd.read_csv("artifacts/live_smoke_fixtures.csv")
          rich = pd.read_csv("artifacts/live_smoke_rich.csv")

          rows = int(len(fixtures))
          enriched_rows = int(rich_status.get("enriched_rows", 0))
          payloads = int(rich_status.get("raw_payload_records", 0))
          coverage = rich_status.get("source_coverage") or {}

          print("## Live rich-data availability")
          print(f"- Fixture retrieval status: {fixture_status.get('status', 'UNKNOWN')}")
          print(f"- Fixture rows observed: {rows}")
          print(f"- Enriched rows: {enriched_rows}")
          print(f"- Real provider payloads observed: {payloads}")

          if rows > 0 and payloads == 0:
              raise SystemExit(
                  "LIVE_DATA_UNAVAILABLE: future fixtures were retrieved but no provider payload was obtained"
              )

          for family, item in (coverage.get("source_families") or {}).items():
              print(
                  f"- {family}: payloads={item.get('payload_records', 0)}, "
                  f"matches={item.get('unique_match_ids', 0)}, "
                  f"coverage={item.get('match_coverage_pct', 0)}%"
              )

          for channel, item in (coverage.get("feature_channels") or {}).items():
              print(
                  f"- {channel}: rows_with_data={item.get('rows_with_data', 0)}, "
                  f"coverage={item.get('coverage_pct', 0)}%"
              )

          if rows == 0:
              print("- RESULT: NO_FIXTURES_TO_PROBE (not a successful data-availability proof)")
          elif payloads > 0:
              print("- RESULT: LIVE_PAYLOADS_OBSERVED")
          else:
              print("- RESULT: UNVERIFIED")
          PY

      - name: Upload live availability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: soccer-rich-data-availability-${{ github.run_id }}
          path: |
            artifacts/live_smoke_fixtures.csv
            artifacts/live_smoke_fixture_status.json
            artifacts/live_smoke_rich.csv
            artifacts/live_smoke_rich_raw.jsonl
            artifacts/live_smoke_rich_status.json
          retention-days: 7
