name: Soccer Opta-like Source Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
  pull_request:
    paths:
      - "src/research/opta_like_source_registry.py"
      - "src/research/opta_like_source_probe.py"
      - "tests/test_opta_like_source_registry.py"
      - "tests/test_opta_like_source_probe.py"
      - ".github/workflows/soccer-source-probe.yml"

permissions:
  contents: read

concurrency:
  group: soccer-source-probe
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install minimal test dependency with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 pytest; then
              exit 0
            fi
            echo "pytest installation attempt ${attempt} failed; retrying..."
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Run source registry and probe tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_opta_like_source_registry.py tests/test_opta_like_source_probe.py
      - name: Probe public source endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m src.research.opta_like_source_probe --output artifacts/opta_like_source_probe.json
      - name: Publish probe artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: opta-like-source-probe
          path: artifacts/opta_like_source_probe.json
          if-no-files-found: error
