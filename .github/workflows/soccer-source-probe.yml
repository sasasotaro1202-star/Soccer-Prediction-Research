name: Soccer Opta-like Source Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
  pull_request:
    paths:
      - "src/research/opta_like_source_registry.py"
      - "src/research/opta_like_source_probe.py"
      - "tests/test_opta_like_source_registry.py"
      - "tests/test_opta_like_source_probe.py"
      - ".github/workflows/soccer-source-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run source registry and probe tests
        run: python -m pytest -q tests/test_opta_like_source_registry.py tests/test_opta_like_source_probe.py
      - name: Probe public source endpoints
        run: python -m src.research.opta_like_source_probe --output artifacts/opta_like_source_probe.json
      - name: Publish probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: opta-like-source-probe
          path: artifacts/opta_like_source_probe.json
          if-no-files-found: error
